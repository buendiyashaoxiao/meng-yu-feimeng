{ "k": "e2_strike", "n": "罢工自由", "when": "last===\"f89_union\" && has(\"bg_legal\") && !has(\"xf_cut\") && f(\"gong\")>=2 && ((has(\"p0_join\")?1:0)+(has(\"tw_quota\")?1:0)+((has(\"zd_dhd\")||has(\"qy_zdh\"))?1:0)+((has(\"hm_list\")||has(\"tq_list\"))?1:0)+((has(\"tq_pay\")||has(\"a6_propose\"))?1:0)+((has(\"xf_union\")||has(\"gh_ind\"))?1:0)+(has(\"jg88_wage\")?1:0))>=3", "place": "上海 · 国棉十七厂", "stamp": "1989年至1990年代", "text": { "W": "<p>那年夏天没有开枪。工自联的五个人在中南海谈了三天，谈出一张纸，工资、住房、选举，一共十一条。军队的人退了会，第二天又回来了。六月里，广场上的学生陆续回了学校，工人回了厂。</p><p>代价是一条一条付的。十一条里有七条要钱，钱从基建里压，从军费里压，军队的报告一个月来三份。秋天的中央全会上，你在政治局里成了少数。一九九〇年春天，你提出退下来，没有人挽留。</p><p>你回了上海。十七厂那年选工会主席，选上的是细纱车间一个四十岁的女工。宪法里罢工自由那一条还在。后来几年，上海的厂里停过几次工，有一回是纺织局，停了三天，谈完就复工了。报纸上用的词是劳动争议。</p>", "R": "<p>你的话没有人接。五月二十日北京戒严，六月三日夜里，军队进了城。工自联的棚子在广场西北角，最先被清掉。六月八日，戒严部队的通告说工自联是非法组织。</p><p>六月下旬，你被停止工作，在家写检查。检查写了三遍，第三遍里你写，一九八七年十七厂的事，你今天还是那个看法。九月，你被免去全部职务。</p><p>那年冬天，有人提议修宪，删去罢工自由那一条。讨论了两次，没有删成。后来十几年，有些厂里的人停工，手里拿着的还是那一条。你在上海的家里听说过几回，没有出门。</p>", "C": "<p>差的那一票是你的。戒严没有通过。五月下旬，工自联的人和政治局的三位委员在人民大会堂谈了两次，学生那边也派了人。六月初，广场上的人一批一批撤了，最后一批走的那天下雨。</p><p>华国锋秋天退了下来。他的人说，是你把局面弄成这样的，张春桥的人也这样说。一九九〇年开中央全会，选政治局，你差九票没有选上。</p><p>你回了全总，后来回了上海。罢工自由那一条留在宪法里。十七厂第二年停过一次工，为奖金，停了一天。厂长来找工会谈，工会主席是工人自己选的。</p>", "G": [ [ "has(\"sz_self\")", "<p>上海的工人也成立了自己的联合会，头一次开会借的是十七厂工会的会议室。你跟市委说，宪法上有罢工自由，工会法上有会员选举，他们开会不犯法。</p><p>六月四日北京还是开了枪。六月里上海光新路道口出了事，后来抓了一批人。你去公安局要过三回人，要出来两个。七月，你被免去十七厂工会主席，是区总工会来人宣布的，会员没有投票。</p><p>第二年换届，会员又把你选了回去。宪法里罢工自由那一条还在。九十年代上海压锭，纺织系统停过好几次工，每一回都有人把那一条抄出来，贴在厂门口。</p>" ], [ "true", "<p>工自联的五个人在全总的会议室里坐了一个下午。你跟他们说，宪法上有罢工自由，工会法上有会员选举，全总可以接你们入会，你们自己选主席。</p><p>六月四日北京还是开了枪。工自联的人后来有被抓的，你去公安局要过两回人，要出来一个。七月全总改组，你被免去副主席，回了上海。</p><p>十七厂那年换届，工会主席是选的。宪法里罢工自由那一条还在。九十年代上海压锭，纺织系统停过好几次工，每一回都有人把那一条抄出来，贴在厂门口。你退休以后去看过一回。</p>" ] ] }, "sum": "这一局走到了最难的地方。一九八七年你承认了十七厂的罢工，宪法里罢工自由那一条留了下来，一九八九年你在会上承认了工人自己的组织。工人一直站在你这一边，可这几步每一步都让你在上面少一个朋友，最后你自己也下来了。留下来的是宪法里的一行字，和几个厂里选出来的工会。", "why": [ [ [ "has(\"p0_join\")", "<p>一九五七年五月，你跟艺徒一起去区里请愿，请愿书是你写的。三十年后十七厂停工，有人当面问起这件事。</p>" ], [ "true", "" ] ], [ [ "has(\"tw_quota\")||has(\"zd_dhd\")||has(\"qy_zdh\")", "<p>早几年留下的东西还在。上海的临时工分批转了正，厂里的规章要过职代会，工人知道自己能在厂里说话。</p>" ], [ "true", "" ] ], [ [ "has(\"xf_union\")", "<p>一九八二年修宪，罢工自由那一条留了下来，又加了一条，工会由会员选举，不受行政管辖。</p>" ], [ "has(\"xf_keep\")", "<p>一九八二年修宪，罢工自由那一条留了下来。</p>" ], [ "has(\"xf_cut\")", "<p>一九八二年修宪，罢工自由那一条删去了。五年以后罢工的人，只能去抄旧宪法。</p>" ], [ "true", "" ] ], [ [ "has(\"bg_legal\")", "<p>一九八七年十七厂为房子停工，会上承认了罢工合法，派人去谈，名单重排。</p>" ], [ "has(\"bg_econ\")", "<p>一九八七年十七厂为房子停工，会上定的是经济主义，带头的五个人记了大过。</p>" ], [ "has(\"bg_force\")", "<p>一九八七年十七厂为房子停工，第二天就有人带着枪进了厂，带走十四个人。</p>" ], [ "true", "" ] ], [ [ "has(\"tq_pay\")", "<p>一九八一年定了，干部的工资不高于本单位的熟练工人。</p>" ], [ "has(\"tq_list\")", "<p>一九八一年，干部的房子、车、特供贴了出来。</p>" ], [ "has(\"tq_term\")", "<p>一九八一年取消了干部终身制，房子、车、特供照旧。</p>" ], [ "has(\"tq_none\")", "<p>一九八一年讲过特权的事，最后照旧。房子、车、特供，一样没动。</p>" ], [ "true", "" ] ], [ [ "last===\"f89_hand\"", "<p>一九八九年五月，你举了手。</p>" ], [ "last===\"f89_no\"", "<p>一九八九年五月，你没有举手。</p>" ], [ "last===\"f89_talk\"", "<p>一九八九年五月，你去了广场，跟他们对话。</p>" ], [ "last===\"f89_union\"", "<p>一九八九年五月，你在会上提议承认工人自治联合会。</p>" ], [ "true", "" ] ] ], "hist": "历史上 1989 年 6 月 8 日工自联被宣布为非法组织，韩东方入狱。1982 年宪法删去的罢工自由后来没有恢复。王洪文这时在服无期徒刑，因病在医院关押，1992 年 8 月 3 日病死，五十六岁。" },

{ "k": "e2_split", "n": "自己人", "when": "last===\"f89_hand\" || (W && f(\"zf\")<=-2)", "place": "北京", "stamp": "1989年至1992年", "text": { "W": [ [ "last===\"f89_hand\"", "<p>六月三日夜里，部队从西边进城。木樨地、复兴门，枪响了一夜。天亮以后广场空了，纪念碑台阶上的东西用卡车拉走，拉了一上午。</p><p>七月，浙江、湖南几个地方的造反派老人联名写了一封信，说你是新生资产阶级，说你一九六七年在上海讲的话，你自己都忘了。信没有登报，抄件在各地传。上海也有人抄，抄的人里有十七厂的。</p><p>你还在台上，又坐了几年。黄金海来北京开会，见了你，握了手，没有说话。一九九二年夏天你住进医院，肝不好，窗户很高，看得见一块天。你梦见安亭，梦见四月五日夜里的广场，两个广场分不清是哪一个。</p>" ], [ "true", "<p>一九八五年，浙江、湖南的一些造反派另立了一个继续革命派，说你是新生资产阶级，说你忘了一九六七年。他们油印了一份刊物，叫《再造反》。那年春天广场上，有一面旗是他们的。</p><p>你没有举手，会上举手的人还是够了。六月三日夜里，部队进了城。七月清查，第一批抓的是《再造反》的人，第二批是工自联的人。名单送到你桌上，你划掉了几个名字，剩下的你没有办法。</p><p>后来你又在台上坐了几年。上海的老战友见了你，握手，不说话。你知道他们在背后叫你什么。一九九二年夏天你住进医院，病房里没有人来看你，来的是秘书，带着文件。</p>" ] ], "R": "<p>五月二十日北京戒严。六月三日夜里，军队进了城，开了枪。六月六日，上海光新路道口，一列火车开进拦车的人群，人群烧了车，后来三个工人被判了死刑。</p><p>全总系统清查，查参加过工自联的工人，查给学生送过水的工会干部。十七厂报上来九个人，你认得其中两个，一个是一九八七年那五个代表里的。有人来问你的意见，你说，按政策办。</p><p>一九九二年开十四大，你退了下来。那年夏天十七厂开始压锭，你回去看过一次。厂门口的人有的认得你，没有人跟你说话。</p>", "C": "<p>差的那一票是你的，你举了手。五月二十日北京戒严，六月三日夜里部队进了城。华国锋在会上说，这一回大家是一致的。他说的时候看着你。</p><p>张春桥那年夏天死在医院里。他的人去送葬，没有通知你。上海的老造反派写信到北京，说你一九六七年站在工人一边，一九八九年站到了另一边。信转到你手上，你看完了，放进抽屉。</p><p>你又当了几年副主席。一九九二年你住院，肝不好。窗户很高，看得见一块天。你梦见安亭的煤场，有人在挥帽子。</p>", "G": [ [ "has(\"sz_self\")", "<p>你举了手。上海市委的表态名单第二天登在《解放日报》上，十七厂工会那一栏有你的名字。六月四日北京开了枪，六月六日上海光新路道口烧了一列火车，后来三个工人被判了死刑。</p><p>工自联被宣布为非法组织以后，有几个人来找过十七厂工会，想找个地方躲一躲，没有人开门。十七厂墙上那张《工会是谁的》，七月里有人在下面添了一行字，现在知道了。</p><p>你在十七厂工会又干了几年，一九九三年退休。退休那天，厂工会送了一个印着会徽的搪瓷杯。你把杯子放在柜子顶上，没有用过。</p>" ], [ "true", "<p>你举了手。表态的名单第二天登在报上，里面有你。六月四日北京开了枪，六月六日上海光新路道口烧了一列火车，后来三个工人被判了死刑。</p><p>工自联被宣布为非法组织以后，有几个人来找过工会，想找个地方躲一躲，没有人开门。十七厂墙上那张《工会是谁的》，七月里有人在下面添了一行字，现在知道了。</p><p>你在全总又坐了几年，一九九三年退休。退休那天，全总送了一个印着会徽的搪瓷杯。你回上海，把杯子放在柜子顶上，没有用过。</p>" ] ] }, "sum": [ [ "last===\"f89_hand\"", "最后一步，你站到了广场的对面。前面十年你替工人争过的东西，在这一年夏天一起算了账。你还在台上，可是那些叫过你小王、叫过你王师傅的人，后来不再叫你了。" ], [ "true", "这一局里，先离开你的是自己人。造反派干部觉得你坐上去以后变了，另立了门户。到了一九八九年，你没有举手，可是你也已经拦不住什么，最后连划掉几个名字的事都要算在你头上。" ] ], "why": [ [ [ "f(\"zf\")<=-2", "<p>这几年造反派干部跟你越走越远。他们说，你坐上去以后，忘了一九六七年。</p>" ], [ "true", "" ] ], [ [ "has(\"bg_legal\")", "<p>一九八七年十七厂为房子停工，会上承认了罢工合法，派人去谈，名单重排。</p>" ], [ "has(\"bg_econ\")", "<p>一九八七年十七厂为房子停工，会上定的是经济主义，带头的五个人记了大过。</p>" ], [ "has(\"bg_force\")", "<p>一九八七年十七厂为房子停工，第二天就有人带着枪进了厂，带走十四个人。</p>" ], [ "true", "" ] ], [ [ "has(\"tq_pay\")", "<p>一九八一年定了，干部的工资不高于本单位的熟练工人。</p>" ], [ "has(\"tq_list\")", "<p>一九八一年，干部的房子、车、特供贴了出来。</p>" ], [ "has(\"tq_term\")", "<p>一九八一年取消了干部终身制，房子、车、特供照旧。</p>" ], [ "has(\"tq_none\")", "<p>一九八一年讲过特权的事，最后照旧。房子、车、特供，一样没动。</p>" ], [ "true", "" ] ], [ [ "has(\"jg88_go\")", "<p>一九八八年八月价格闯关，第二天起商店门口排长队，银行门口也排。</p>" ], [ "has(\"jg88_slow\")", "<p>一九八八年价格没有闯关，压了基建，物价涨得慢了，奖金也少了。</p>" ], [ "has(\"jg88_wage\")", "<p>一九八八年先给职工每月加了十二块钱，第二年才分批放开价格。</p>" ], [ "true", "" ] ], [ [ "f(\"gong\")>=2", "<p>到最后，工人还站在你这一边。</p>" ], [ "f(\"gong\")<=-2", "<p>到最后，工人已经不信你了。</p>" ], [ "true", "" ] ], [ [ "last===\"f89_hand\"", "<p>一九八九年五月，你举了手。</p>" ], [ "last===\"f89_no\"", "<p>一九八九年五月，你没有举手。</p>" ], [ "last===\"f89_talk\"", "<p>一九八九年五月，你去了广场，跟他们对话。</p>" ], [ "last===\"f89_union\"", "<p>一九八九年五月，你在会上提议承认工人自治联合会。</p>" ], [ "true", "" ] ] ], "hist": "历史上 1989 年 6 月 3 日夜到 4 日，戒严部队进入北京，开枪清场。6 月 6 日上海光新路道口发生火车冲撞拦车人群、人群烧车事件，事后三名工人被判处死刑。王洪文这时在服无期徒刑，因病在医院关押，1992 年 8 月 3 日病死，五十六岁。" },

{ "k": "e2_union_G", "n": "工会是谁的", "when": "G && last!==\"f89_hand\" && (has(\"gh_ind\") || last===\"f89_union\")", "place": "上海 · 国棉十七厂", "stamp": "1989年至1990年代", "text": { "G": [ [ "last===\"f89_union\"&&has(\"sz_self\")", "<p>上海工自联的五个人在十七厂工会的小屋里谈了一个下午。你说，十七厂工会可以接你们入会，你们自己选代表。他们中间有一个铁路工人，二十几岁，听完了说，我们要的是自己的会，入了你们的会，就是你们的了。</p><p>六月四日北京还是开了枪。六月八日，北京的工自联被宣布为非法组织，上海的也散了。那天下午的谈话，有人写了材料报到区里。七月，区总工会来人宣布，免去你十七厂工会主席的职务，会员没有投票。</p><p>第二年十七厂的工会换届，是会员一张票一张票选的，你也去投了一票。选出来的工会，后来压锭的时候替女工跟厂里谈买断的钱，谈多了一点。墙上那张《工会是谁的》，有人用玻璃框裱起来，挂在工会办公室里。</p>" ], [ "last===\"f89_union\"", "<p>工自联的人在全总的会议室里谈了一个下午。你说，全总可以接你们入会，你们自己选主席。他们中间有一个铁路工人，二十几岁，听完了说，我们要的是自己的会，入了你们的会，就是你们的了。</p><p>六月四日北京还是开了枪。六月八日，工自联被宣布为非法组织。那天下午的谈话，有人写了材料报上去。七月全总改组，你被免去职务，回了上海。</p><p>十七厂的工会那年换届，是会员一张票一张票选的，你也去投了一票。选出来的工会，后来压锭的时候替女工跟厂里谈买断的钱，谈多了一点。墙上那张《工会是谁的》，有人用玻璃框裱起来，挂在工会办公室里。</p>" ], [ "has(\"sz_self\")", "<p>十一大改的章程，那年春天在几百个厂里试了第一轮。十七厂是头一批，会员又把你选上了。五月，有的厂里刚选出来的工会主席带着工人上了街，横幅上写着某某厂工会。全总的电话一天响到晚，各省问，这算不算违反章程。</p><p>六月以后，清查从这些新选的工会主席查起。新章程没有废，全总下发了一个补充通知，基层工会换届，候选人要经同级党委审查。区总工会来人，要你在传达记录上签字。你签了，第二天提出辞去工会主席。</p><p>厂里的人来看你，带了两斤橘子，说下一届还选你，问补充通知要不要执行。你说，你们自己定。</p>" ], [ "true", "<p>十一大改的章程，那年春天在几百个厂里试了第一轮。五月，有的厂里刚选出来的工会主席带着工人上了街，横幅上写着某某厂工会。全总的电话一天响到晚，各省问，这算不算违反章程。</p><p>六月以后，清查从这些新选的工会主席查起。新章程没有废，全总下发了一个补充通知，基层工会换届，候选人要经同级党委审查。通知上有你的签字。签完以后，你提出辞职。</p><p>你回了上海。十七厂的工会主席是去年选的，选的时候没有审查。他来看你，带了两斤橘子，说厂里的人问，补充通知要不要执行。你说，你们自己定。</p>" ] ] }, "sum": [ [ "has(\"gh_ind\")", "这一局你守的是工会。章程改过，会员选过，一九八九年夏天以后又收回去一半。收不回去的那一半在厂里，几百个基层工会知道了自己可以选，后来压锭、买断的时候，有的工会是替工人去谈的。" ], [ "true", "这一局你守的是工会。章程没有改成，一九八九年五月你替工人自己的组织说了话，夏天以后这些话都收了回去。收不回去的在厂里，十七厂的工会是会员选的，后来压锭、买断的时候，是替工人去谈的。" ] ], "why": [ [ [ "has(\"bg_legal\")", "<p>一九八七年十七厂为房子停工，会上承认了罢工合法，派人去谈，名单重排。</p>" ], [ "has(\"bg_econ\")", "<p>一九八七年十七厂为房子停工，会上定的是经济主义，带头的五个人记了大过。</p>" ], [ "has(\"bg_force\")", "<p>一九八七年十七厂为房子停工，第二天就有人带着枪进了厂，带走十四个人。</p>" ], [ "true", "" ] ], [ [ "has(\"xf_union\")", "<p>一九八二年修宪，罢工自由那一条留了下来，又加了一条，工会由会员选举，不受行政管辖。</p>" ], [ "has(\"xf_keep\")", "<p>一九八二年修宪，罢工自由那一条留了下来。</p>" ], [ "has(\"xf_cut\")", "<p>一九八二年修宪，罢工自由那一条删去了。五年以后罢工的人，只能去抄旧宪法。</p>" ], [ "true", "" ] ], [ [ "has(\"gh_ind\")", "<p>一九八八年工会十一大改了章程，基层工会主席由会员直接选，工会独立于行政。</p>" ], [ "has(\"gh_mid\")", "<p>一九八八年工会十一大，改革写进了报告，章程没有改。</p>" ], [ "has(\"gh_no\")", "<p>一九八八年工会十一大，改革那一节压成两段，什么也没改。</p>" ], [ "true", "" ] ], [ [ "has(\"jg88_go\")", "<p>一九八八年八月价格闯关，第二天起商店门口排长队，银行门口也排。</p>" ], [ "has(\"jg88_slow\")", "<p>一九八八年价格没有闯关，压了基建，物价涨得慢了，奖金也少了。</p>" ], [ "has(\"jg88_wage\")", "<p>一九八八年先给职工每月加了十二块钱，第二年才分批放开价格。</p>" ], [ "true", "" ] ], [ [ "last===\"f89_hand\"", "<p>一九八九年五月，你举了手。</p>" ], [ "last===\"f89_no\"", "<p>一九八九年五月，你没有举手。</p>" ], [ "last===\"f89_talk\"", "<p>一九八九年五月，你去了广场，跟他们对话。</p>" ], [ "last===\"f89_union\"", "<p>一九八九年五月，你在会上提议承认工人自治联合会。</p>" ], [ "true", "" ] ] ], "hist": "历史上 1988 年工会十一大提出的改革设想，1989 年以后没有照原样推行，全总领导层随后调整。工自联向全总求援没有得到帮助。王洪文这时在服无期徒刑，因病在医院关押，1992 年 8 月 3 日病死，五十六岁。" },

{ "k": "e2_gw_R", "n": "顾问", "when": "R && has(\"hyb_retire\")", "place": "北京 · 中央顾问委员会", "stamp": "1989年至1992年", "text": { "R": [ [ "last===\"f89_talk\"", "<p>五月里你去过一次广场。回来以后，顾问委员会开会，有一位老同志问你，你代表谁去的。你说，代表我自己。记录上记了一行。</p><p>六月三日夜里，军队进了城。你那天晚上在家，窗户开着，听见西边有枪声，一直响到天亮。</p><p>一九九二年十四大，顾问委员会撤销了，你也正式退了休，五十六岁。你回上海住，每天上午去公园，下午到十七厂门口的茶馆坐一会儿。有人认出你，问你，老王，北京那年到底怎么回事。你说，我那时候在顾委，坐在后排。</p>" ], [ "last===\"f89_union\"", "<p>顾问委员会的会，那年五月开得很勤。轮到你说话，你说，工人自己组织起来的会，可以请他们来谈。会场里很静，记录上记了一行。</p><p>六月三日夜里，军队进了城。你那天晚上在家，窗户开着，听见西边有枪声，一直响到天亮。</p><p>一九九二年十四大，顾问委员会撤销了，你也正式退了休，五十六岁。你回上海住，每天上午去公园，下午到十七厂门口的茶馆坐一会儿。有人认出你，问你，老王，北京那年到底怎么回事。你说，我那时候在顾委，坐在后排。</p>" ], [ "true", "<p>顾问委员会的会，那年五月开得很勤。有几位老同志的意见，是直接送到小平同志那里去的。你坐在后排，轮到你说话，你说了几句，说工人上街，是因为物价，因为房子。记录上记了一行。</p><p>六月三日夜里，军队进了城。你那天晚上在家，窗户开着，听见西边有枪声，一直响到天亮。</p><p>一九九二年十四大，顾问委员会撤销了，你也正式退了休，五十六岁。你回上海住，每天上午去公园，下午到十七厂门口的茶馆坐一会儿。有人认出你，问你，老王，北京那年到底怎么回事。你说，我那时候在顾委，坐在后排。</p>" ] ] }, "sum": [ [ "last===\"f89_talk\"", "这一局你退得早。一九八七年你自己退进了顾问委员会。一九八九年春天你去过一次广场，说的话没有人照办。退休以后，你在上海过了很多年。" ], [ "true", "这一局你退得早。一九八七年你自己退进了顾问委员会，一九八九年春天的事，你在后排说过几句话，没有改变什么。你没有站在广场对面，也没有站在广场上。退休以后，你在上海过了很多年。" ] ], "why": [ [ [ "has(\"sz_self\")", "<p>一九八三年清理三种人，你自己先退了一步。</p>" ], [ "has(\"sz_list\")", "<p>一九八三年清理三种人，你交出了上海的名单，换下了自己。</p>" ], [ "has(\"sz_fight\")", "<p>一九八三年清理三种人，你顶住了，可是很多人记住了那一次。</p>" ], [ "true", "" ] ], [ [ "has(\"hyb_keep\")", "<p>一九八七年一月，扩大会议上替胡耀邦说话的只有你一个。</p>" ], [ "has(\"hyb_quiet\")", "<p>一九八七年一月，胡耀邦辞职那次会上，你没有说话。</p>" ], [ "has(\"hyb_retire\")", "<p>一九八七年十三大，你自己退下来，进了顾问委员会。</p>" ], [ "true", "" ] ], [ [ "has(\"bg_legal\")", "<p>一九八七年十七厂为房子停工，会上承认了罢工合法，派人去谈，名单重排。</p>" ], [ "has(\"bg_econ\")", "<p>一九八七年十七厂为房子停工，会上定的是经济主义，带头的五个人记了大过。</p>" ], [ "has(\"bg_force\")", "<p>一九八七年十七厂为房子停工，第二天就有人带着枪进了厂，带走十四个人。</p>" ], [ "true", "" ] ], [ [ "has(\"jg88_go\")", "<p>一九八八年八月价格闯关，第二天起商店门口排长队，银行门口也排。</p>" ], [ "has(\"jg88_slow\")", "<p>一九八八年价格没有闯关，压了基建，物价涨得慢了，奖金也少了。</p>" ], [ "has(\"jg88_wage\")", "<p>一九八八年先给职工每月加了十二块钱，第二年才分批放开价格。</p>" ], [ "true", "" ] ], [ [ "last===\"f89_hand\"", "<p>一九八九年五月，你举了手。</p>" ], [ "last===\"f89_no\"", "<p>一九八九年五月，你没有举手。</p>" ], [ "last===\"f89_talk\"", "<p>一九八九年五月，你去了广场，跟他们对话。</p>" ], [ "last===\"f89_union\"", "<p>一九八九年五月，你在会上提议承认工人自治联合会。</p>" ], [ "true", "" ] ] ], "hist": "历史上中央顾问委员会 1982 年设立，1992 年中共十四大撤销。1989 年春夏之间，几位老同志的意见对中央的决定起了很大作用。王洪文这时在服无期徒刑，因病在医院关押，1992 年 8 月 3 日病死，五十六岁。" },

{ "k": "e2_retreat", "n": "大退却", "when": "(W||C) && (has(\"jb_eng\") || (has(\"gb_exam\") && (has(\"jg88_go\") || has(\"qy_cz\"))))", "place": "北京", "stamp": "1989年至1990年代", "text": { "W": "<p>五月的那几次会上，你说的话都记在了记录里。表决的时候你在少数。坐在对面的人大多是大学毕业的，学的是机械、水利、化工，说话有条理，不拍桌子。他们说，先稳定，再说别的。六月三日夜里，部队进了城。</p><p>那年秋天的全会公报上，继续革命四个字还在，在第三段。第一段讲治理整顿，第二段讲科学技术。工人阶级领导一切也还在，写在宪法里。上海的工厂里，厂长负责，车间主任是考试考上来的。</p><p>你还是副主席，开会坐第二排。一九九〇年你提出退下来，他们说，你是工人出身的老同志，再留一届。你又留了一届，开会的时候常常不说话。</p>", "C": "<p>五月的那几次会上，你说的话都记在了记录里。表决的时候你在少数。华国锋那边这几年提上来的人，大多是工程师出身，坐在对面，说话有条理，不拍桌子。他们说，先稳定，再说别的。六月三日夜里，部队进了城。</p><p>那年秋天的公报，不再像两个人在说话了。继续革命四个字还在，在第三段，前两段讲的是治理整顿和科学技术。张春桥的人没有再争，他们中间有几个也去读了函授大学。</p><p>你还是副主席。一九九〇年你提出退下来，他们说，你是工人出身的老同志，再留一届。你又留了一届，开会的时候常常不说话。</p>" }, "sum": "这一局没有坏人。计划越来越复杂，就越离不开懂计划的人。十年下来，坐在你对面的都是工程师，口号一句没改，内容已经换了。一九八九年的事，是他们按他们的办法办的，你在少数。", "why": [ [ [ "has(\"gb_exam\")", "<p>一九八三年定了干部看文凭，恢复考试。十年里，政治局里坐的人换了一批。</p>" ], [ "has(\"gb_721\")", "<p>一九八三年七二一大学扩大成工人的正规大学。毕业的人后来也成了新的一层。</p>" ], [ "has(\"gb_rec\")", "<p>一九八三年干部还是推荐。推荐上来的人，很多是当年一起造反的。</p>" ], [ "has(\"gb_both\")", "<p>一九八三年干部推荐、考试、公开评议三样一起，各占一半的位子。</p>" ], [ "true", "" ] ], [ [ "has(\"jb_eng\")", "<p>一九八六年的接班会上，你让工程师出身的人接了班。</p>" ], [ "has(\"jb_self\")", "<p>一九八六年的接班会上，你接了班。</p>" ], [ "has(\"jb_elect\")", "<p>一九八六年的接班会上，谁接班交给中央委员会差额选举。</p>" ], [ "true", "" ] ], [ [ "has(\"jg_dual\")", "<p>一九八五年定了双轨制。计划内外的差价，三年里养出了一批倒批文的人。</p>" ], [ "has(\"jg_freeze\")", "<p>一九八五年价格继续冻结，靠票证。倒的人倒的是票。</p>" ], [ "has(\"jg_once\")", "<p>一九八五年调了一次价，发了一次补贴，补贴后来跟不上物价。</p>" ], [ "has(\"jg_neg\")", "<p>一九八五年起，计划内的价格由职代会和计划部门协商，谈得很慢。</p>" ], [ "true", "" ] ], [ [ "has(\"jg88_go\")", "<p>一九八八年八月价格闯关，第二天起商店门口排长队，银行门口也排。</p>" ], [ "has(\"jg88_slow\")", "<p>一九八八年价格没有闯关，压了基建，物价涨得慢了，奖金也少了。</p>" ], [ "has(\"jg88_wage\")", "<p>一九八八年先给职工每月加了十二块钱，第二年才分批放开价格。</p>" ], [ "true", "" ] ], [ [ "last===\"f89_hand\"", "<p>一九八九年五月，你举了手。</p>" ], [ "last===\"f89_no\"", "<p>一九八九年五月，你没有举手。</p>" ], [ "last===\"f89_talk\"", "<p>一九八九年五月，你去了广场，跟他们对话。</p>" ], [ "last===\"f89_union\"", "<p>一九八九年五月，你在会上提议承认工人自治联合会。</p>" ], [ "true", "" ] ] ], "hist": "历史上 1982 年中央委员中大学毕业生的比例过半，1987 年政治局里理工科出身的已占一半左右（安舟《红色工程师的崛起》第十章，转述）。苏联在 1931 年以后也走过这样一段，红色专家取代了红色厂长。王洪文这时在服无期徒刑，因病在医院关押，1992 年 8 月 3 日病死，五十六岁。" },

{ "k": "e2_C_mid", "n": "中间", "when": "C && (last===\"f89_no\" || last===\"f89_talk\")", "place": "北京 · 中南海", "stamp": "1989年至1990年", "text": { "C": "<p>表决的时候，你说再等几天。差一票，戒严没有通过，会议说再议。</p><p>再议了五天。这五天里，华国锋那边的人去找军队，张春桥的人去找上海。五月底，北京戒严，是用中央军委的名义宣布的，政治局没有再开会。六月三日夜里，部队进了城。</p><p>秋天，两边都说是你误了事。华国锋的人说，早三天，就不用流血。张春桥的人说，你本来就不该让他们上街。那年的公报还是两个人在说话，一段讲稳定，一段讲继续革命，你的名字排到了后面。一九九〇年，你回了全总。</p>" }, "sum": "这一局你一直夹在两个人中间。十几年里你靠的是那一票，一九七七年是，一九八九年也是。这一回那一票没有拦住什么，只是让两边都有了怪你的理由。", "why": [ [ [ "has(\"sz_self\")", "<p>一九八三年清理三种人，你自己先退了一步。</p>" ], [ "has(\"sz_list\")", "<p>一九八三年清理三种人，你交出了上海的名单，换下了自己。</p>" ], [ "has(\"sz_fight\")", "<p>一九八三年清理三种人，你顶住了，可是很多人记住了那一次。</p>" ], [ "true", "" ] ], [ [ "has(\"bg_legal\")", "<p>一九八七年十七厂为房子停工，会上承认了罢工合法，派人去谈，名单重排。</p>" ], [ "has(\"bg_econ\")", "<p>一九八七年十七厂为房子停工，会上定的是经济主义，带头的五个人记了大过。</p>" ], [ "has(\"bg_force\")", "<p>一九八七年十七厂为房子停工，第二天就有人带着枪进了厂，带走十四个人。</p>" ], [ "true", "" ] ], [ [ "has(\"jg88_go\")", "<p>一九八八年八月价格闯关，第二天起商店门口排长队，银行门口也排。</p>" ], [ "has(\"jg88_slow\")", "<p>一九八八年价格没有闯关，压了基建，物价涨得慢了，奖金也少了。</p>" ], [ "has(\"jg88_wage\")", "<p>一九八八年先给职工每月加了十二块钱，第二年才分批放开价格。</p>" ], [ "true", "" ] ], [ [ "last===\"f89_hand\"", "<p>一九八九年五月，你举了手。</p>" ], [ "last===\"f89_no\"", "<p>一九八九年五月，你没有举手。</p>" ], [ "last===\"f89_talk\"", "<p>一九八九年五月，你去了广场，跟他们对话。</p>" ], [ "last===\"f89_union\"", "<p>一九八九年五月，你在会上提议承认工人自治联合会。</p>" ], [ "true", "" ] ] ], "hist": "历史上 1989 年 5 月 17 日政治局常委在邓小平家中开会，决定戒严；赵紫阳不同意，后被撤销全部职务。王洪文这时在服无期徒刑，因病在医院关押，1992 年 8 月 3 日病死，五十六岁。" },

{ "k": "e2_stall", "n": "停滞", "when": "real(\"wage\")<760 || (d(\"政权选举\")===0 && d(\"干部特权与劳动\")===0)", "place": "北京", "stamp": "1989年至1992年", "text": { "W": "<p>一九八九年的职工平均工资，比历史上的这一年少好几百块。二级工还是二级工，知青的孩子在城里没有户口。广场上的人喊的话，跟十年前民主墙上的话差不多。</p><p>五月的会上，你说了你的话。会上举手的人够了。六月三日夜里，部队进了城。七月的公报说形势大好。内参上说，城镇待业的人又多了，上海有两个纺织厂开始拖工资。</p><p>后来几年都一样。你在台上，坐得很稳，因为没有什么事要你去改。一九九二年夏天你住院，肝不好。病房里有一台电视，放的是一部老电影，你看过很多遍。</p>", "R": "<p>一九八九年跟历史上的那一年差不多。四月胡耀邦去世，五月学生绝食，二十日北京戒严，六月三日夜里开了枪。你说过的话，记录上有一行。</p><p>全总那年的报告说，职工家里的账一年比一年难算。十七厂的房子还是不够分，一九八七年排上队的人，有一半还在等。</p><p>你在台上又坐了几年，管工会，开会的时候报数字。一九九二年你退了下来。那年夏天，上海的纺织厂开始压锭。</p><p>你退下来那天，全总的人送你到门口。有个年轻干部问你，这十年工会到底争到了什么。你想了一会儿，说，每年一张表，报上去，有人看。</p>", "C": "<p>一九八九年的事，最后是军队定的。你说过的话，记录上有一行。六月三日夜里，部队进了城。</p><p>十年里，华国锋的规划和张春桥的继续革命轮流写进公报，工资动得很少，干部的房子和车一样没少。那年秋天的内参说，城镇待业的人又多了，几个省开始拖工资。</p><p>你还是副主席，坐在两个人中间。上海的老战友来北京看你，说厂里还是老样子，三十年工龄的挡车工还住在棚户区。你说，我知道，内参上有。一九九二年你住院，肝不好，窗户很高，看得见一块天。</p>", "G": [ [ "has(\"sz_self\")", "<p>一九八九年跟历史上的那一年差不多。四月胡耀邦去世，五月学生绝食，二十日北京戒严，六月三日夜里开了枪。全总送过十万块钱给绝食的学生买药，后来这件事也写进了检查。</p><p>工会的报告照旧，每年讲劳动竞赛，讲职工之家。十七厂工会换届，候选人还是党委先提，那张《工会是谁的》没有人再贴。</p><p>你在十七厂工会一直待到一九九三年退休。那时候厂里已经开始压锭了。</p><p>崔根娣那年也退了休。她说，你回厂里这么多年，十七厂的房子还是那几栋。你没有说话。</p>" ], [ "true", "<p>一九八九年跟历史上的那一年差不多。四月胡耀邦去世，五月学生绝食，二十日北京戒严，六月三日夜里开了枪。全总送过十万块钱给绝食的学生买药，后来这件事也写进了检查。</p><p>工会的报告照旧，每年讲劳动竞赛，讲职工之家。十七厂的工会主席还是党委提名，那张《工会是谁的》没有人再贴。</p><p>你在全总一直待到一九九三年退休。退休以后你回上海，十七厂已经开始压锭了。</p><p>崔根娣那年也退了休。她说，你在北京这么多年，十七厂的房子还是那几栋。你没有说话。</p>" ] ] }, "sum": [ [ "real(\"wage\")<760", "这一局什么都没有变多少。工资没涨上去，干部的房子和车还是那样，选举的事说了几回没有下文。一九八九年来的时候，和历史上的那一年差不多。你在台上，可是能改的事你没有改，或者改不动。" ], [ "true", "这一局什么都没有变多少。工资涨了一些，干部的房子和车还是那样，选举的事说了几回没有下文。一九八九年来的时候，和历史上的那一年差不多。你在台上，可是能改的事你没有改，或者改不动。" ] ], "why": [ [ [ "has(\"tq_pay\")", "<p>一九八一年定了，干部的工资不高于本单位的熟练工人。</p>" ], [ "has(\"tq_list\")", "<p>一九八一年，干部的房子、车、特供贴了出来。</p>" ], [ "has(\"tq_term\")", "<p>一九八一年取消了干部终身制，房子、车、特供照旧。</p>" ], [ "has(\"tq_none\")", "<p>一九八一年讲过特权的事，最后照旧。房子、车、特供，一样没动。</p>" ], [ "true", "" ] ], [ [ "has(\"jg_dual\")", "<p>一九八五年定了双轨制。计划内外的差价，三年里养出了一批倒批文的人。</p>" ], [ "has(\"jg_freeze\")", "<p>一九八五年价格继续冻结，靠票证。倒的人倒的是票。</p>" ], [ "has(\"jg_once\")", "<p>一九八五年调了一次价，发了一次补贴，补贴后来跟不上物价。</p>" ], [ "has(\"jg_neg\")", "<p>一九八五年起，计划内的价格由职代会和计划部门协商，谈得很慢。</p>" ], [ "true", "" ] ], [ [ "real(\"wage\")<760", "<p>到一九八九年，职工的平均工资比历史上的这一年少好几百块。</p>" ], [ "ind(\"wage\")>2100", "<p>到一九八九年，职工的平均工资比历史上的这一年高。</p>" ], [ "true", "" ] ], [ [ "has(\"bg_legal\")", "<p>一九八七年十七厂为房子停工，会上承认了罢工合法，派人去谈，名单重排。</p>" ], [ "has(\"bg_econ\")", "<p>一九八七年十七厂为房子停工，会上定的是经济主义，带头的五个人记了大过。</p>" ], [ "has(\"bg_force\")", "<p>一九八七年十七厂为房子停工，第二天就有人带着枪进了厂，带走十四个人。</p>" ], [ "true", "" ] ], [ [ "last===\"f89_hand\"", "<p>一九八九年五月，你举了手。</p>" ], [ "last===\"f89_no\"", "<p>一九八九年五月，你没有举手。</p>" ], [ "last===\"f89_talk\"", "<p>一九八九年五月，你去了广场，跟他们对话。</p>" ], [ "last===\"f89_union\"", "<p>一九八九年五月，你在会上提议承认工人自治联合会。</p>" ], [ "true", "" ] ] ], "hist": "历史上 1989 年职工平均工资 1935 元，全年零售物价比上年上涨 17.8%，职工实际工资下降。王洪文这时在服无期徒刑，因病在医院关押，1992 年 8 月 3 日病死，五十六岁。" },

{ "k": "e2_out_W", "n": "靠边", "when": "false", "place": "北京 · 西山", "stamp": "后来", "text": { "W": "<p>通知是在一次政治局会议以后送来的。会上没有点你的名字。散了会，有人到你的办公室，说中央考虑你身体不好，先休息一段。秘书第二天就换了。</p><p>你搬出了中南海，住进西山的一个院子。院子里有两棵柿子树，门口有哨兵。报纸照常送，文件不送了。你每天看报，看到上海的消息就多看两遍。</p><p>后来那几年发生的事，你都是从报纸上读到的。报纸上说形势大好。你知道内参上不是这么写的，可内参已经不送到你这里了。</p><p>一九九二年夏天你住进医院，肝不好。西山院子里的柿子熟了，没有人摘。</p>" }, "sum": "你在台上没有站到最后。一次一次让步，一次一次得罪人，到最后没有人再替你说话。继续革命还在继续，没有你。", "why": [ [ [ "pos<=1", "<p>这几年你在台上一直站得不稳，一次一次退，退到最后没有地方再退。</p>" ], [ "true", "" ] ], [ [ "f(\"zf\")<=-2", "<p>这几年造反派干部跟你越走越远。他们说，你坐上去以后，忘了一九六七年。</p>" ], [ "true", "" ] ], [ [ "f(\"gong\")>=2", "<p>到最后，工人还站在你这一边。</p>" ], [ "f(\"gong\")<=-2", "<p>到最后，工人已经不信你了。</p>" ], [ "true", "" ] ], [ [ "has(\"bg_legal\")", "<p>一九八七年十七厂为房子停工，会上承认了罢工合法，派人去谈，名单重排。</p>" ], [ "has(\"bg_econ\")", "<p>一九八七年十七厂为房子停工，会上定的是经济主义，带头的五个人记了大过。</p>" ], [ "has(\"bg_force\")", "<p>一九八七年十七厂为房子停工，第二天就有人带着枪进了厂，带走十四个人。</p>" ], [ "true", "" ] ] ], "hist": "历史上 1976 年 10 月王洪文在怀仁堂被隔离审查，此后再没有出来。王洪文这时在服无期徒刑，因病在医院关押，1992 年 8 月 3 日病死，五十六岁。" },

{ "k": "e2_out_R", "n": "靠边", "when": "false", "place": "上海", "stamp": "后来", "text": { "R": "<p>那年开中央全会，新的名单上没有你。会前有人找你谈话，说上海那一周的事、清理三种人的事，要你有个交代。你交了一份材料，写了二十几页。</p><p>你被免去职务，回了上海，住在康平路附近一个旧公寓里。组织关系转到十七厂，每个月去支部过一次组织生活。支部书记三十几岁，开会的时候不叫你发言。</p><p>后来的事，你是从报纸上读到的。有一年十七厂分房，有人在楼道里认出你，说，王师傅，你当年在北京管工资，怎么没管管我们。你说，管过，没管住。</p>" }, "sum": "这一局你本来就站得不稳。上海那一周、清理三种人，老账一笔一笔翻出来，你手里只有工会，挡不住。你回了上海，后来的十年和你没有关系了。", "why": [ [ [ "pos<=1", "<p>这几年你在台上一直站得不稳，一次一次退，退到最后没有地方再退。</p>" ], [ "true", "" ] ], [ [ "has(\"sz_self\")", "<p>一九八三年清理三种人，你自己先退了一步。</p>" ], [ "has(\"sz_list\")", "<p>一九八三年清理三种人，你交出了上海的名单，换下了自己。</p>" ], [ "has(\"sz_fight\")", "<p>一九八三年清理三种人，你顶住了，可是很多人记住了那一次。</p>" ], [ "true", "" ] ], [ [ "has(\"hyb_keep\")", "<p>一九八七年一月，扩大会议上替胡耀邦说话的只有你一个。</p>" ], [ "has(\"hyb_quiet\")", "<p>一九八七年一月，胡耀邦辞职那次会上，你没有说话。</p>" ], [ "has(\"hyb_retire\")", "<p>一九八七年十三大，你自己退下来，进了顾问委员会。</p>" ], [ "true", "" ] ], [ [ "has(\"bg_legal\")", "<p>一九八七年十七厂为房子停工，会上承认了罢工合法，派人去谈，名单重排。</p>" ], [ "has(\"bg_econ\")", "<p>一九八七年十七厂为房子停工，会上定的是经济主义，带头的五个人记了大过。</p>" ], [ "has(\"bg_force\")", "<p>一九八七年十七厂为房子停工，第二天就有人带着枪进了厂，带走十四个人。</p>" ], [ "true", "" ] ] ], "hist": "历史上 1980 年十一届五中全会，汪东兴、纪登奎、吴德、陈锡联辞去职务；1983 年起清理“三种人”。王洪文这时在服无期徒刑，因病在医院关押，1992 年 8 月 3 日病死，五十六岁。" },

{ "k": "e2_out_C", "n": "靠边", "when": "false", "place": "北京", "stamp": "后来", "text": { "C": "<p>华国锋和张春桥那一回难得意见一致。会上有人说，你两头都想要，两头都没要到。表决的时候，两边的人都举了手。</p><p>你被免去副主席，回全总挂了一个名，后来全总也不去了。你住在北京，房子还是原来的，车收走了。张春桥的秘书来看过你一次，带来一句话，说你当年在上海那一周要是进了会议室就好了。</p><p>后来的公报还是两个人在说话，中间少了一个人。你每天看报，看哪一段是谁的人写的，一看就知道。一九九二年你住院，窗户很高，看得见一块天。</p>" }, "sum": "共治的局面靠的是中间有人。你在中间站了几年，两边都用你，两边也都防你。等到两边终于意见一致，第一件一致的事是把你拿下来。", "why": [ [ [ "pos<=1", "<p>这几年你在台上一直站得不稳，一次一次退，退到最后没有地方再退。</p>" ], [ "true", "" ] ], [ [ "has(\"sz_self\")", "<p>一九八三年清理三种人，你自己先退了一步。</p>" ], [ "has(\"sz_list\")", "<p>一九八三年清理三种人，你交出了上海的名单，换下了自己。</p>" ], [ "has(\"sz_fight\")", "<p>一九八三年清理三种人，你顶住了，可是很多人记住了那一次。</p>" ], [ "true", "" ] ], [ [ "has(\"bg_legal\")", "<p>一九八七年十七厂为房子停工，会上承认了罢工合法，派人去谈，名单重排。</p>" ], [ "has(\"bg_econ\")", "<p>一九八七年十七厂为房子停工，会上定的是经济主义，带头的五个人记了大过。</p>" ], [ "has(\"bg_force\")", "<p>一九八七年十七厂为房子停工，第二天就有人带着枪进了厂，带走十四个人。</p>" ], [ "true", "" ] ], [ [ "f(\"gong\")>=2", "<p>到最后，工人还站在你这一边。</p>" ], [ "f(\"gong\")<=-2", "<p>到最后，工人已经不信你了。</p>" ], [ "true", "" ] ] ], "hist": "历史上没有共治这一局。1976 年 10 月江青、张春桥、姚文元、王洪文同时被隔离审查。王洪文这时在服无期徒刑，因病在医院关押，1992 年 8 月 3 日病死，五十六岁。" },

{ "k": "e2_out_G", "n": "靠边", "when": "false", "place": "上海 · 国棉十七厂", "stamp": "后来", "text": { "G": [ [ "has(\"sz_self\")", "<p>区总工会来了两个人，很客气，说你在工会干了这么多年，辛苦了，十七厂工会的工作先交给别的同志。会员没有投票。</p><p>你还在十七厂，挂着工会委员的名，没有分工。工会开会，你坐在后面。有一回讨论分房，有人问你的意见，主持会议的人说，老王同志先休息休息。</p><p>那张《工会是谁的》，你在旧报纸堆里找到过一张抄件，纸已经黄了。你把它折好，夹在笔记本里。</p><p>一九九四年厂里压锭，工会开会讨论买断的钱，没有通知你。你在会议室门口听了一会儿，回家了。</p>" ], [ "true", "<p>全总换届，新的名单上没有你。来谈话的人很客气，说你在工会干了这么多年，辛苦了，回上海休息休息。</p><p>你回了十七厂，挂着工会副主席的名，没有分工。工会开会，你坐在后面。有一回讨论分房，有人问你的意见，主持会议的人说，老王同志刚回来，情况还不熟悉。</p><p>那张《工会是谁的》，你在旧报纸堆里找到过一张抄件，纸已经黄了。你把它折好，夹在笔记本里。</p><p>一九九四年厂里压锭，工会开会讨论买断的钱，没有通知你。你在会议室门口听了一会儿，回家了。</p>" ] ] }, "sum": [ [ "has(\"sz_self\")", "这一局你的力量在工会，工会的力量在你争来的那几条上。争得太多，上面换了人，第一个换下来的就是你。十七厂的工会主席你没有当到头，后来那些年工会怎么样，跟你说话的人越来越少。" ], [ "true", "这一局你的力量在工会，工会的力量在你争来的那几条上。争得太多，上面换了人，第一个换下来的就是你。你回了十七厂，后来那些年工会怎么样，跟你说话的人越来越少。" ] ], "why": [ [ [ "pos<=1", "<p>这几年你在台上一直站得不稳，一次一次退，退到最后没有地方再退。</p>" ], [ "true", "" ] ], [ [ "has(\"bg_legal\")", "<p>一九八七年十七厂为房子停工，会上承认了罢工合法，派人去谈，名单重排。</p>" ], [ "has(\"bg_econ\")", "<p>一九八七年十七厂为房子停工，会上定的是经济主义，带头的五个人记了大过。</p>" ], [ "has(\"bg_force\")", "<p>一九八七年十七厂为房子停工，第二天就有人带着枪进了厂，带走十四个人。</p>" ], [ "true", "" ] ], [ [ "has(\"gh_ind\")", "<p>一九八八年工会十一大改了章程，基层工会主席由会员直接选，工会独立于行政。</p>" ], [ "has(\"gh_mid\")", "<p>一九八八年工会十一大，改革写进了报告，章程没有改。</p>" ], [ "has(\"gh_no\")", "<p>一九八八年工会十一大，改革那一节压成两段，什么也没改。</p>" ], [ "true", "" ] ], [ [ "f(\"gong\")>=2", "<p>到最后，工人还站在你这一边。</p>" ], [ "f(\"gong\")<=-2", "<p>到最后，工人已经不信你了。</p>" ], [ "true", "" ] ] ], "hist": "历史上 1978 年全总九大以后，倪志福任主席到 1993 年。王洪文这时在服无期徒刑，因病在医院关押，1992 年 8 月 3 日病死，五十六岁。" },

{ "k": "e2_after", "n": "没有举手", "when": "true", "place": "北京", "stamp": "1989年至1990年代", "text": { "W": "<p>表决戒严的那次会上，你没有举手，举手的人差三票。军队的人退了会，第二天带来一份几个大军区联名的报告。你把报告放在桌上，没有批。</p><p>五月底，广场上的人少了。六月初下了两场雨，最后一批学生撤回了学校。没有开枪。七月，政治局通过了几条，工资、物价、干部的车。军队的报告还在你桌上，后来又来了两份。</p><p>一九九〇年秋天，你去南京开会，回来的路上，你的车在城外停了四十分钟，前面过的是一队军车。那天晚上，你给上海打了一个电话，叫他们把民兵的枪库再查一遍，两把锁，钥匙分开放。你在台上又坐了几年，坐得不稳。这一局没有结束的日期。</p>", "R": "<p>你没有赞成戒严。五月二十日北京还是戒严了。六月三日夜里，军队进了城，开了枪。</p><p>六月下旬，你被停止工作，写检查。九月，你被免去全部职务。决定里有一句，在动乱中支持动乱。你在上面签了收到。六月以后十七厂报上来的清查名单，你已经看不到了。</p><p>你回了上海，住在杨浦区一栋旧楼里。一九九四年十七厂压锭，崔根娣拿到一张纸，买断工龄。那天晚上她跟你说，要是你还在北京就好了。你说，我在北京的时候，也没有管住。</p>", "C": "<p>那一票你没有投给戒严。差一票，戒严没有通过。五月下旬，政治局的人分头去广场谈，谈了两个礼拜。六月初，广场上的人一批一批撤了。没有开枪。</p><p>秋天，华国锋退了下来，张春桥那年冬天死在医院里。两个人的公报，第一次只剩下一个声音，可那个声音是谁的，没有人说得清。军队的人在会上一句话也不说，记录上写的是，无意见。</p><p>你当了几年主持工作的副主席。一九九二年你住院，肝不好，窗户很高，看得见一块天。你醒过来，问秘书，外面怎么样。秘书说，还好。</p>", "G": [ [ "has(\"sz_self\")", "<p>你没有举手。上海市委的表态名单第二天登在《解放日报》上，十七厂工会那一栏空着。五月二十日北京戒严，六月三日夜里开了枪。</p><p>七月，区总工会来人宣布，免去你十七厂工会主席的职务。来谈话的人说，你在关键时刻没有站稳。你说，我站的是工会的位置。</p><p>那年厂里换届，有人提你的名，区总工会说不合适。后来几年，厂里的人见了你还叫你王主席。一九九四年压锭，女工们拿着买断的纸来找你，问你怎么办。你说，去找工会。她们说，你就是工会。</p>" ], [ "true", "<p>你没有举手。全总的表态信第二天登在报上，署名里没有你。五月二十日北京戒严，六月三日夜里开了枪。</p><p>七月全总改组，你被免去副主席。来谈话的人说，你在关键时刻没有站稳。你说，我站的是工会的位置。</p><p>你回了上海，回十七厂。那年厂里换届，有人提你的名，区总工会说不合适。后来几年，厂里的人见了你还叫你王主席。一九九四年压锭，女工们拿着买断的纸来找你，问你怎么办。你说，去找工会。她们说，你就是工会。</p>" ] ] }, "sum": [ [ "W", "这一局到最后你没有举手，没有开枪。你守住了那一年，可是军队的报告一份一份放在你的桌上，你在台上坐得不稳。这一局没有给出结束的日期。" ], [ "C", "这一局你用中间那一票拦住了戒严。两个人的共治到这一年散了，留下来的局面谁也说不清是谁的。" ], [ "G&&has(\"sz_self\")", "你没有站到广场的对面。这件事在那一年夏天要付代价，你付了。你还在十七厂，后来的事和历史上差不多，只是有几个人记得，那年五月有一个人没有举手。" ], [ "true", "你没有站到广场的对面。这件事在那一年夏天要付代价，你付了。你回了上海，后来的事和历史上差不多，只是有几个人记得，那年五月有一个人没有举手。" ] ], "why": [ [ [ "has(\"bg_legal\")", "<p>一九八七年十七厂为房子停工，会上承认了罢工合法，派人去谈，名单重排。</p>" ], [ "has(\"bg_econ\")", "<p>一九八七年十七厂为房子停工，会上定的是经济主义，带头的五个人记了大过。</p>" ], [ "has(\"bg_force\")", "<p>一九八七年十七厂为房子停工，第二天就有人带着枪进了厂，带走十四个人。</p>" ], [ "true", "" ] ], [ [ "has(\"tq_pay\")", "<p>一九八一年定了，干部的工资不高于本单位的熟练工人。</p>" ], [ "has(\"tq_list\")", "<p>一九八一年，干部的房子、车、特供贴了出来。</p>" ], [ "has(\"tq_term\")", "<p>一九八一年取消了干部终身制，房子、车、特供照旧。</p>" ], [ "has(\"tq_none\")", "<p>一九八一年讲过特权的事，最后照旧。房子、车、特供，一样没动。</p>" ], [ "true", "" ] ], [ [ "has(\"jg88_go\")", "<p>一九八八年八月价格闯关，第二天起商店门口排长队，银行门口也排。</p>" ], [ "has(\"jg88_slow\")", "<p>一九八八年价格没有闯关，压了基建，物价涨得慢了，奖金也少了。</p>" ], [ "has(\"jg88_wage\")", "<p>一九八八年先给职工每月加了十二块钱，第二年才分批放开价格。</p>" ], [ "true", "" ] ], [ [ "real(\"wage\")<760", "<p>到一九八九年，职工的平均工资比历史上的这一年少好几百块。</p>" ], [ "ind(\"wage\")>2100", "<p>到一九八九年，职工的平均工资比历史上的这一年高。</p>" ], [ "true", "" ] ], [ [ "f(\"gong\")>=2", "<p>到最后，工人还站在你这一边。</p>" ], [ "f(\"gong\")<=-2", "<p>到最后，工人已经不信你了。</p>" ], [ "true", "" ] ], [ [ "last===\"f89_hand\"", "<p>一九八九年五月，你举了手。</p>" ], [ "last===\"f89_no\"", "<p>一九八九年五月，你没有举手。</p>" ], [ "last===\"f89_talk\"", "<p>一九八九年五月，你去了广场，跟他们对话。</p>" ], [ "last===\"f89_union\"", "<p>一九八九年五月，你在会上提议承认工人自治联合会。</p>" ], [ "true", "" ] ] ], "hist": "历史上 1989 年 5 月 20 日北京部分地区戒严，6 月 3 日夜到 4 日清场。中共中央总书记赵紫阳因不同意戒严，6 月被撤销全部职务。王洪文这时在服无期徒刑，因病在医院关押，1992 年 8 月 3 日病死，五十六岁。" }
);

Object.assign(GLOSS2, {
 "罢工自由": "1975 年宪法第二十八条、1978 年宪法第四十五条都写有公民有罢工的自由。1982 年宪法删去了这一条。",
 "经济主义": "文革里的说法，指用钱和物质利益收买群众、把政治斗争引向经济要求。1967 年一月上海补发工资被定为经济主义妖风。",
 "艺徒": "五十年代上海对工厂学徒的叫法，学徒期三年，每月拿十几元津贴。1957 年 5 月上海艺徒罢工请愿闹得很凶。",
 "胡耀邦": "1980 年起任中共中央总书记。1986 年底学生上街以后受到批评，1987 年 1 月辞去总书记，仍是政治局委员。1989 年 4 月 15 日去世。",
 "薄一波": "老干部，1982 年起任中央顾问委员会副主任。1987 年 1 月主持批评胡耀邦的党内生活会。",
 "生活会": "党内的批评与自我批评会。1987 年 1 月 10 日起中央开了几天，批评胡耀邦。",
 "赵紫阳": "1980 年起任国务院总理，1987 年 1 月代理总书记，十三大正式当选。1989 年因不同意戒严被撤销全部职务。",
 "十三大": "中国共产党第十三次全国代表大会，1987 年 10 月 25 日至 11 月 1 日在北京召开。一批老同志退出中央委员会，进入中央顾问委员会。",
 "顾问委员会": "中央顾问委员会，1982 年设立，让老同志从第一线退下来以后仍有发言的地方，邓小平、陈云先后任主任。1992 年十四大撤销。",
 "双轨制": "1985 年起，同一种生产资料有计划内和计划外两个价钱。拿得到计划内指标的人，转手卖到计划外，就能赚差价。",
 "官倒": "八十年代后期的说法，指有权或者有关系的人倒卖批文、指标和紧缺物资，从双轨制的差价里赚钱。",
 "北戴河": "河北海边，中央领导夏天在这里办公、开会。1988 年 8 月政治局在这里通过了价格和工资改革的初步方案。",
 "治理经济环境，整顿经济秩序": "1988 年 9 月十三届三中全会提出的方针，价格闯关停下来，压基建，收贷款，简称治理整顿。",
 "中国工会第十一次全国代表大会": "1988 年 10 月下旬在北京召开，通过《工会改革的基本设想》，提出工会要独立自主地开展工作，改变事实上存在的委派制。",
 "委派制": "基层工会主席由党委或上级工会指定，会员举手通过。1988 年工会十一大的报告承认这种做法事实上存在，提出要改。",
 "倪志福": "北京永定机械厂钳工出身，发明过倪志福钻头。1978 年起任全国总工会主席，一直到 1993 年。",
 "首都工人自治联合会": "1989 年 4 月下旬北京一些工人自己组织的团体，简称工自联，铁路工人韩东方是负责人之一。6 月 8 日被戒严部队指挥部宣布为非法组织。",

  st.ind.wage *= 1 + (price+realW)/100;
  st.ind.farm *= 1 + (price+realF)/100;
  st.ind.house *= 1 + Math.max(0, BASE.house[w] + st.mod.house)/100;
  st.ind.debt = Math.max(0, st.ind.debt + BASE.debt[w] + st.mod.debt + 8*(D("开放与所有制")-1));
  st.ind.jobless = Math.max(100, st.ind.jobless + BASE.jobless[w] - 20*(D("开放与所有制")-1));
  const bump = (k, v, why) => { const old = st.fac[k]; st.fac[k] = Math.max(-3, Math.min(3, old+v)); if(old!==st.fac[k]) notes.push(why); };
  if(realW < 1) bump("gong", -1, "工人手里的钱这一年几乎没有多，工人对你又冷了一点。");
  else if(realW >= 4.5 && st.fac.gong < 2) bump("gong", 1, "工资涨得比物价快，工人对你热了一点。");
  if(price >= 8) bump("gong", -1, "物价涨得太快，城里人排队抢购，工人的怨气记到了台上的人头上。");
  if(realF >= 6 && st.fac.nong < 2) bump("nong", 1, "农民手里的钱多了，乡下的报告口气松了。");
  else if(realF < 2) bump("nong", -1, "农民的收入几乎没动，几个省报上来缺粮。");
  if(st.ind.jobless > 700) bump("zf", -1, "城里待业的人太多，街道和公安的报告一份接一份，各地的造反派干部压力最大。");
  st.years[st.y] = {ind:{...st.ind}, fac:{...st.fac}, dims:st.dims.slice(), gb:st.cur.gb.slice(), nc:st.cur.nc.slice(), notes:notes.slice(), rate:{price, realW, realF}};
}

/* ---------- 存档和上一步 ---------- */
function save(){ try{ localStorage.setItem(SAVEK, JSON.stringify({st, undo:UNDO.slice(-12)})); }catch(e){} }
function load(){ try{ const o = JSON.parse(localStorage.getItem(SAVEK)||"null"); if(o && o.st && o.st.w){ return o; } }catch(e){} return null; }
function pushUndo(){ UNDO.push(JSON.stringify(st)); if(UNDO.length>60) UNDO.shift(); }
function undo(){ if(!UNDO.length) return; st = JSON.parse(UNDO.pop()); save(); render(); }

/* ---------- 动作 ---------- */
function choose(i){
  const card = CARD(st.q[st.qi]); const list = opts(card); const o = list[i];
  if(!o || !ev(o.req)) return;
  pushUndo();
  let adopted = o, t = null;
  if(o.vote!==false){
    t = tally(card, o);
    if(!t.pass) adopted = fallback(card, o);
  }
  const changes = adopted ? apply(adopted) : [];
  if(adopted){
    const g = R(adopted.gb), n = R(adopted.nc);
    if(g) st.cur.gb.push(g);
    if(n) st.cur.nc.push(n);
  }
  st.last = adopted ? (setOf(adopted)[0]||null) : null;
  st.log.push({y:st.y, id:card.id, n:card.n, pick:setOf(o)[0], pickT:R(o.t), got:adopted ? setOf(adopted)[0] : null, gotT:adopted ? R(adopted.t) : "", vote:o.vote!==false, pass:t ? t.pass : true});
  st.res = {id:card.id, i, ai: adopted ? list.indexOf(adopted) : -1, t, changes};
  st.page = "res";
  save(); render(); window.scrollTo(0,0);
}
function nextFromRes(){
  pushUndo();
  if(st.pos<=0){ st.page = "end"; st.endKey = "e2_out_" + st.w; save(); render(); window.scrollTo(0,0); return; }
  st.qi++;
  if(st.qi < st.q.length) st.page = "card";
  else if(st.y===1978){ /* 1978 年只剩十二月，不滚指标，只记公报和内参 */
    Object.assign(st.years[1978], {gb:st.cur.gb.slice(), nc:st.cur.nc.slice(), notes:[], fac:{...st.fac}, dims:st.dims.slice()}); st.page = "year"; }
  else { rollYear(); st.page = "year"; }
  save(); render(); window.scrollTo(0,0);
}
function nextFromYear(){
  pushUndo();
  if(st.y>=1989){ st.page = "end"; st.endKey = pickEnding(); }
  else startYear(st.y+1);
  save(); render(); window.scrollTo(0,0);
}
function pickEnding(){
  for(const e of ENDINGS2){ if(e.when==="false") continue; if(ev(e.when)) return e.k; }
  return ENDINGS2[ENDINGS2.length-1].k;
}

  const p = !st ? "start" : st.page;
  document.documentElement.dataset.act = p==="end" ? "0" : st && st.w==="W" ? "2r" : "2";
  app().innerHTML = p==="start" ? renderStart() : p==="intro" ? renderIntro() : p==="card" ? renderCard() : p==="res" ? renderRes() : p==="year" ? renderYear() : renderEnd();
}

/* ---------- 事件 ---------- */
document.addEventListener("click", e => {
  const g = e.target.closest(".g"); if(g){ openGloss(g.dataset.g); return; }
  if(e.target.closest("#sheet .x")){ $("#sheet").hidden = true; return; }
  const c = e.target.closest("[data-ch]"); if(c){ choose(+c.dataset.ch); return; }
  const s = e.target.closest("[data-sample]");
  if(s){ const o = SAMPLES[s.dataset.sample]; if(newGame(o.code, o.x)){ save(); render(); window.scrollTo(0,0); } return; }
  const b = e.target.closest("[data-act]"); if(!b) return;
  const a = b.dataset.act;
  if(a==="go"){
    const raw = $("#code").value.trim();
    const code = (raw.match(/MFM[12][0-9A-Za-z-]+/i)||[raw])[0];
    const xs = ((raw.match(/[&?]x=([a-z0-9_.,]+)/)||[])[1] || (decodeURIComponent(location.hash).match(/[&?]x=([a-z0-9_.,]+)/)||[])[1] || "").split(/[.,]/).filter(Boolean);
    const d = decodeWorld(code), err = $("#codeerr");
    if(!d.ok){ err.hidden = false; err.textContent = d.err; return; }
    if(!worldKey(d)){ err.hidden = false; err.innerHTML = `这串代码是“${d.typeName}”的世界线。这一局你不在台上，没有第二部。${d.factLabels.length ? "这一局留下了" + d.factLabels.join("，") + "。" : ""}`; return; }
    newGame(code, xs); save(); render(); window.scrollTo(0,0);
  }
  else if(a==="resume"){ const o = load(); if(o){ st = o.st; UNDO = o.undo||[]; render(); } }
  else if(a==="begin"){ pushUndo(); startYear(1978); save(); render(); window.scrollTo(0,0); }
  else if(a==="next") nextFromRes();
  else if(a==="nexty") nextFromYear();
  else if(a==="undo") undo();
  else if(a==="home"){ st = null; render(); window.scrollTo(0,0); }
  else if(a==="again"){ const code = st.code, x = st.flags.filter(k=>/^(w1_|w2_|r1_|r2_|c1_|c2_|e6_)/.test(k)); newGame(code, x); save(); render(); window.scrollTo(0,0); }
  else if(a==="state"){ const p = $("#statep"); p.hidden = !p.hidden; if(!p.hidden){ p.innerHTML = statePanel(); } b.setAttribute("aria-pressed", String(!p.hidden)); }
});
/* 主题 */
let theme = (()=>{ try{ return localStorage.getItem("mfm-theme")||"auto"; }catch(e){ return "auto"; } })();
function applyTheme(){
  if(theme==="auto") delete document.documentElement.dataset.theme; else document.documentElement.dataset.theme = theme;
  $("#theme").textContent = "主题 " + ({auto:"自动",light:"浅色",dark:"深色"}[theme]);
}
$("#theme").addEventListener("click", ()=>{ theme = {auto:"light",light:"dark",dark:"auto"}[theme]; try{ localStorage.setItem("mfm-theme", theme); }catch(e){} applyTheme(); });
applyTheme();
render();
window.__mfm2 = {get st(){ return st; }, set st(v){ st = v; }, CARDS2, ENDINGS2, GLOSS2, decodeWorld, encodeWorld, newGame, startYear, choose, nextFromRes, nextFromYear, render, tally, opts, ev, R, SAMPLES, pickEnding};

</script>
</body>
