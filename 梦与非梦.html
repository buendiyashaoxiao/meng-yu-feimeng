<!doctype html>
<html lang="zh-CN" data-act="1">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>梦与非梦</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;700;900&family=Noto+Sans+SC:wght@400;500&family=IBM+Plex+Mono:wght@400;500&family=Ma+Shan+Zheng&display=swap">
<style>
/* Layout: one reading column like a stack of carbon-copied forms; choices are tear-off slips; archive and sources fold out below. */
:root{
  --paper:#e8ecea; --slip:#f6f8f6; --ink:#1c2321; --muted:#5a6661;
  --carbon:#2b3d8c; --stamp:#9e2f28; --rule:#c3cbc7; --fict:#7a5a12;
  --kraft:#c8a36b; --kraft2:#b48d55; --kraft-ink:#2a1e0e; --water:#bfd0d6; --land:#dde3df; --wall:#b8b2a5;
  --serif:"Noto Serif SC","Songti SC","SimSun",serif;
  --sans:"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --brush:"Ma Shan Zheng","STKaiti","KaiTi",var(--serif);
}
/* act tones, light */
:root[data-act="2"]{--paper:#dfe1e3; --slip:#f1f2f3; --carbon:#34465e; --land:#d6d9dc}
:root[data-act="2r"]{--paper:#ebe3df; --slip:#f7f2f0; --carbon:#a3261c; --land:#e2dad5}
:root[data-act="0"]{--paper:#d9dcdb; --slip:#e9ecea}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#121615; --slip:#1a201e; --ink:#dde3e0; --muted:#8e9a95;
    --carbon:#93a6f2; --stamp:#e27a70; --rule:#2c3432; --fict:#d8b25e;
    --kraft:#5b4527; --kraft2:#4a381f; --kraft-ink:#f0e2c8; --water:#1f3440; --land:#1a1f1e; --wall:#35322d; color-scheme:dark}
  :root[data-act="2"]:not([data-theme="light"]){--paper:#0f1114; --slip:#171a1f; --carbon:#9fb3d6; --land:#16191d}
  :root[data-act="2r"]:not([data-theme="light"]){--paper:#171111; --slip:#211818; --carbon:#f08a7c; --land:#1d1616}
  :root[data-act="0"]:not([data-theme="light"]){--paper:#0b0c0c; --slip:#131515}
}
:root[data-theme="dark"]{
  --paper:#121615; --slip:#1a201e; --ink:#dde3e0; --muted:#8e9a95;
  --carbon:#93a6f2; --stamp:#e27a70; --rule:#2c3432; --fict:#d8b25e;
  --kraft:#5b4527; --kraft2:#4a381f; --kraft-ink:#f0e2c8; --water:#1f3440; --land:#1a1f1e; --wall:#35322d; color-scheme:dark}
:root[data-theme="dark"][data-act="2"]{--paper:#0f1114; --slip:#171a1f; --carbon:#9fb3d6; --land:#16191d}
:root[data-theme="dark"][data-act="2r"]{--paper:#171111; --slip:#211818; --carbon:#f08a7c; --land:#1d1616}
:root[data-theme="dark"][data-act="0"]{--paper:#0b0c0c; --slip:#131515}
*{box-sizing:border-box}
html,body{margin:0}
html{overflow-x:hidden}
[hidden]{display:none!important}
body{background:var(--paper);color:var(--ink);font-family:var(--serif);font-size:17px;line-height:1.85;transition:background .4s}
.wrap{max-width:42rem;margin:0 auto;padding-inline:16px;padding-block:28px 64px}
header.top{display:flex;justify-content:space-between;align-items:baseline;gap:8px 12px;flex-wrap:wrap;
  font-family:var(--mono);font-size:12px;letter-spacing:.06em;color:var(--muted);border-bottom:1px solid var(--rule);padding-bottom:10px}
header.top b{color:var(--ink);font-weight:500}
header.top .right{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.stamp{font-family:var(--mono);font-size:13px;letter-spacing:.05em;color:var(--carbon);margin-top:28px}
.place{font-family:var(--sans);font-size:13px;color:var(--muted);margin-top:2px}
h1{font-weight:900;font-size:clamp(2.4rem,9vw,3.6rem);line-height:1.1;letter-spacing:.04em;margin:40px 0 8px;text-wrap:balance}
h1 small{display:block;font-family:var(--sans);font-weight:400;font-size:1rem;letter-spacing:.2em;color:var(--muted);margin-top:14px}
h2{font-weight:700;font-size:1.35rem;margin:6px 0 0;text-wrap:balance}
.story p{margin:1em 0}
.story .aside{font-family:var(--sans);font-size:14px;color:var(--muted)}
.story blockquote{margin:1em 0;padding:4px 0 4px 14px;border-left:2px solid var(--carbon);font-size:16px}
.persona .story{font-family:var(--sans);font-size:16px;line-height:1.95}
.persona h2{font-family:var(--sans);font-weight:500}
.tag{display:inline-block;font-family:var(--sans);font-size:11px;letter-spacing:.08em;padding:1px 7px;border:1px solid currentColor;border-radius:2px;margin-left:8px;vertical-align:2px;line-height:1.6}
.tag.fict{color:var(--fict)} .tag.hist{color:var(--carbon)} .tag.disp{color:var(--stamp)}
.tag.recon{color:var(--carbon);border-style:dashed} .tag.illus{color:var(--fict);border-style:dashed} .tag.photo{color:var(--ink)}
figcaption .tag{margin-left:0;margin-right:6px}
.choices{display:grid;gap:12px;margin-top:28px}
.choice{all:unset;box-sizing:border-box;display:block;cursor:pointer;background:var(--slip);color:var(--ink);
  padding:14px 18px;border-top:2px dashed var(--rule);font-family:var(--serif);font-size:16px;line-height:1.7;transition:transform .15s,border-color .15s}
.choice:hover{border-top-color:var(--carbon);transform:translateX(3px)}
.choice:focus-visible{outline:2px solid var(--carbon);outline-offset:3px}
.choice .who{display:block;font-family:var(--sans);font-size:12px;color:var(--muted);margin-bottom:2px}
.choice.locked{cursor:default;opacity:.62}
.choice.locked:hover{transform:none;border-top-color:var(--rule)}
.choice.locked .why{display:block;font-family:var(--sans);font-size:13px;color:var(--stamp);margin-top:4px}
.choice.grown{border-top-color:var(--fict)}
.choice.grown::before{content:"梦里多出来的一条路";display:block;font-family:var(--sans);font-size:11px;letter-spacing:.1em;color:var(--fict);margin-bottom:2px}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-top:40px;border-top:1px solid var(--rule);padding-top:14px}
.tbtn{all:unset;cursor:pointer;font-family:var(--sans);font-size:13px;padding:5px 12px;border:1px solid var(--rule);border-radius:3px;color:var(--muted)}
.tbtn[aria-pressed="true"]{color:var(--carbon);border-color:var(--carbon)}
.tbtn:focus-visible{outline:2px solid var(--carbon);outline-offset:2px}
.hbtn{all:unset;cursor:pointer;font-family:var(--mono);font-size:12px;color:var(--muted);border-bottom:1px dotted var(--muted)}
.hbtn:focus-visible{outline:2px solid var(--carbon)}
.panel{margin-top:16px;background:var(--slip);padding:16px 18px;font-size:15px}
.panel h3{font-family:var(--sans);font-size:12px;font-weight:500;letter-spacing:.12em;color:var(--muted);margin:0 0 10px}
.arch{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.arch li{font-family:var(--mono);font-size:13.5px;line-height:1.7;border-left:2px solid currentColor;padding-left:12px;overflow-wrap:anywhere}
.arch li.y77{border-left-color:var(--stamp)}
.arch .empty{opacity:.7}
/* kraft file envelope */
.envelope{position:relative;margin-top:16px;background:var(--kraft);color:var(--kraft-ink);padding:64px 18px 20px;border-radius:3px;
  box-shadow:0 1px 0 rgba(0,0,0,.15),0 8px 18px -10px rgba(0,0,0,.4);overflow:hidden}
.envelope::before{content:"";position:absolute;left:0;right:0;top:0;height:46px;background:var(--kraft2);clip-path:polygon(0 0,100% 0,100% 40%,50% 100%,0 40%)}
.envelope::after{content:"";position:absolute;left:calc(50% - 9px);top:30px;width:18px;height:18px;border-radius:50%;border:2px solid var(--kraft-ink);opacity:.55}
.env-label{position:relative;font-family:var(--mono);font-size:12px;letter-spacing:.08em;border:1px solid currentColor;padding:6px 10px;margin:0 0 14px;max-width:26rem;background:rgba(255,255,255,.08)}
.env-label b{font-family:var(--serif);font-size:15px;letter-spacing:.2em;display:block}
.env-sw{position:relative;display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.envelope .tbtn{color:var(--kraft-ink);border-color:currentColor;opacity:.7}
.envelope .tbtn[aria-pressed="true"]{opacity:1;background:rgba(0,0,0,.12)}
.seal{position:absolute;right:14px;top:56px;font-family:var(--sans);font-weight:500;font-size:13px;letter-spacing:.15em;padding:4px 10px;
  border:3px double currentColor;border-radius:4px;transform:rotate(-11deg);opacity:.85;pointer-events:none}
.seal.s66{color:var(--carbon)} .seal.s77{color:var(--stamp)}
.seal.stamping{animation:stampin .5s cubic-bezier(.2,1.6,.4,1)}
@keyframes stampin{0%{transform:rotate(-11deg) scale(2.4);opacity:0}60%{opacity:.95}100%{transform:rotate(-11deg) scale(1);opacity:.85}}
.envelope.flip .arch{animation:flip .4s ease-out}
@keyframes flip{from{transform:perspective(600px) rotateX(-40deg);opacity:0}to{transform:none;opacity:1}}
.src p{margin:.4em 0;font-family:var(--sans);font-size:14px;line-height:1.7}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:28px 0 0}
.lens{margin-top:14px}
.lens p{margin:.8em 0}
.lens .disclaim{font-family:var(--sans);font-size:13px;color:var(--fict)}
.rel{display:grid;gap:12px;margin-top:14px}
.rel div{display:grid;grid-template-columns:5.5em 1fr;gap:10px}
.rel b{font-family:var(--sans);font-weight:500;font-size:14px;color:var(--muted)}
.rel span{min-width:0}
.restart{all:unset;cursor:pointer;display:inline-block;margin-top:36px;margin-right:10px;font-family:var(--sans);font-size:15px;color:var(--paper);background:var(--ink);padding:10px 22px;border-radius:3px}
.restart.alt{background:transparent;color:var(--ink);border:1px solid var(--ink)}
.restart:focus-visible{outline:2px solid var(--carbon);outline-offset:3px}
.note-start{font-family:var(--sans);font-size:14px;color:var(--muted);line-height:1.8}
@media (prefers-reduced-motion:reduce){.choice{transition:none}.seal.stamping,.envelope.flip .arch{animation:none}}
.g{all:unset;cursor:pointer;color:inherit;border-bottom:1px dotted var(--carbon);text-decoration:none}
.g:hover{color:var(--carbon);border-bottom-style:solid}
.g:focus-visible{outline:2px solid var(--carbon);outline-offset:2px}
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:10;padding:0 12px calc(12px + env(safe-area-inset-bottom,0px));pointer-events:none}
.sheet-in{pointer-events:auto;max-width:40rem;margin:0 auto;background:var(--slip);border-top:3px solid var(--carbon);box-shadow:0 -6px 24px rgba(0,0,0,.18);padding:16px 18px 18px;max-height:70vh;overflow-y:auto}
.sheet-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.sheet-in h4{margin:0;font-size:1.05rem;font-weight:700}
.sheet-in p{margin:.6em 0 0;font-family:var(--sans);font-size:14.5px;line-height:1.8}
.x{all:unset;cursor:pointer;font-family:var(--sans);font-size:13px;color:var(--muted);padding:2px 6px}
.x:focus-visible{outline:2px solid var(--carbon)}
.glist{display:flex;flex-wrap:wrap;gap:8px 14px;font-size:15px}
.fade{animation:fin .35s ease-out}
@keyframes fin{from{opacity:.4;transform:translateY(4px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.fade{animation:none}}
/* figures */
figure.art{margin:1.6em 0;padding:0}
figure.art svg{display:block;width:100%;height:auto;max-width:100%}
figure.art figcaption{font-family:var(--sans);font-size:12.5px;line-height:1.7;color:var(--muted);margin-top:8px}
.zoom{all:unset;cursor:zoom-in;display:block;width:100%}
.zoom:focus-visible{outline:2px solid var(--carbon);outline-offset:3px}
#lightbox{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.82);display:flex;flex-direction:column}
#lightbox .lb-bar{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;color:#eee;font-family:var(--sans);font-size:13px}
#lightbox .lb-bar button{all:unset;cursor:pointer;color:#eee;border:1px solid #888;padding:4px 12px;border-radius:3px}
#lightbox .lb-body{flex:1;overflow:auto;padding:12px}
#lightbox .lb-body svg{display:block;width:max(100%,900px);height:auto;margin:0 auto}
@media (min-width:1000px){#lightbox .lb-body svg{width:100%;max-width:1400px}}
/* svg palette */
.f-ink{fill:var(--ink)} .s-ink{stroke:var(--ink)} .f-mut{fill:var(--muted)} .s-mut{stroke:var(--muted)}
.f-red{fill:var(--stamp)} .s-red{stroke:var(--stamp)} .f-blue{fill:var(--carbon)} .s-blue{stroke:var(--carbon)}
.f-slip{fill:var(--slip)} .f-paper{fill:var(--paper)} .s-rule{stroke:var(--rule)} .f-water{fill:var(--water)} .s-water{stroke:var(--water)}
.s-paper{stroke:var(--paper)} .f-land{fill:var(--land)} .f-wall{fill:var(--wall)} .f-fict{fill:var(--fict)}
svg text{font-family:var(--sans)}
svg .brush{font-family:var(--brush)}
svg .serif{font-family:var(--serif)}
svg .mono{font-family:var(--mono)}
/* verdict page for dead ends */
.verdict{position:relative;overflow:hidden;margin-top:24px;background:var(--slip);border:1px solid var(--rule);padding:22px 20px 26px;font-family:var(--mono);font-size:13.5px;line-height:1.9}
.verdict h3{font-family:var(--serif);font-size:1.1rem;letter-spacing:.3em;text-align:center;margin:0 0 14px}
.verdict .vseal{position:absolute;right:16px;bottom:14px;color:var(--stamp);border:3px double currentColor;border-radius:50%;width:86px;height:86px;display:grid;place-items:center;
  font-family:var(--sans);font-size:12px;letter-spacing:.1em;text-align:center;transform:rotate(-14deg);opacity:.8;animation:stampin .6s cubic-bezier(.2,1.6,.4,1)}
.verdict p{margin:.3em 0;padding-right:0}
.verdict .vbody{padding-bottom:70px}
.timeline{display:flex;gap:0;margin:18px 0 0;font-family:var(--mono);font-size:11px;color:var(--muted);border-top:1px solid var(--rule)}
.timeline span{flex:1;padding-top:6px;position:relative;min-width:0;overflow-wrap:anywhere}
.timeline span::before{content:"";position:absolute;top:-4px;left:0;width:7px;height:7px;border-radius:50%;background:var(--rule)}
.timeline span.on{color:var(--carbon)}
.timeline span.on::before{background:var(--carbon)}
</style>
</head>
<body>
<div class="wrap">
  <header class="top"><span id="actname">梦与非梦</span><span class="right"><span id="dreams"></span><button type="button" class="hbtn" id="theme">主题 自动</button></span></header>
  <main id="app" aria-live="polite"></main>
  <div id="sheet" role="dialog" aria-modal="false" aria-label="词条" hidden>
    <div class="sheet-in"><div class="sheet-head"><h4></h4><button type="button" class="x" aria-label="关闭">关闭</button></div><p></p></div>
  </div>
  <div id="lightbox" role="dialog" aria-modal="true" aria-label="放大查看" hidden>
    <div class="lb-bar"><span>可以左右拖动查看</span><button type="button" id="lb-x">关闭</button></div>
    <div class="lb-body"></div>
  </div>
</div>

<script>
(function(){
const S0 = {scene:"title", act:1, facts:[], archive:[], lens:"huang", tab:null, y77:false, seen:[]};
const SAVE_KEY = "mfm-state", DREAM_KEY = "mfm-dreams", THEME_KEY = "mfm-theme";
function fresh(){ return Object.assign({}, S0, {facts:[], archive:[], seen:[]}) }
let st = fresh();
let dreamCount = 0;
try{ dreamCount = parseInt(localStorage.getItem(DREAM_KEY)||"0",10)||0 }catch(e){}
let saved = null;
try{
  const raw = localStorage.getItem(SAVE_KEY);
  if(raw){ const o = JSON.parse(raw); if(o && typeof o==="object" && Array.isArray(o.facts)) saved = o; }
}catch(e){ saved = null }
const hot = window.claude && window.claude.hot && window.claude.hot.data && window.claude.hot.data.st;
if(hot) st = Object.assign(fresh(), hot);

function save(){
  try{ localStorage.setItem(SAVE_KEY, JSON.stringify(st)) }catch(e){}
}
function bumpDream(){
  dreamCount++;
  try{ localStorage.setItem(DREAM_KEY, String(dreamCount)) }catch(e){}
}

const has = f => st.facts.includes(f);
const any = (...fs) => fs.some(has);
const all = (...fs) => fs.every(has);

/* ---------- theme ---------- */
const root = document.documentElement;
let theme = "auto";
try{ theme = localStorage.getItem(THEME_KEY) || "auto" }catch(e){}
function applyTheme(){
  if(theme==="auto") delete root.dataset.theme; else root.dataset.theme = theme;
  document.getElementById("theme").textContent = "主题 " + ({auto:"自动",light:"浅色",dark:"深色"}[theme]);
}
document.getElementById("theme").addEventListener("click",()=>{
  theme = theme==="auto" ? "light" : theme==="light" ? "dark" : "auto";
  try{ localStorage.setItem(THEME_KEY, theme) }catch(e){}
  applyTheme();
});
applyTheme();

/* ---------- glossary ---------- */
const GLOSS = {
  yufeng:{m:["裕丰纱厂"],t:"裕丰纱厂",b:"日本商人在上海杨树浦开办的纱厂。1945年抗战胜利后收归国有，改为中国纺织建设公司第十七棉纺织厂，也就是后来的国棉十七厂，上海最大的几家纺织厂之一。厂里的老工人很多经历过日本工头的时代，“翻身”对他们来说是具体的事，这也是后来他们对厂党委的期待特别高、失望也特别深的原因之一。"},
  cui:{m:["崔根娣"],t:"崔根娣",b:"王洪文的妻子，国棉十七厂工人。文革后她评价王洪文“爱管闲事”。1976年10月，王洪文曾托秘书向她提出离婚以免牵连家人，她表示只要孩子给她就答应，但手续未办完王洪文就被捕了。"},
  nie:{m:["聂元梓"],t:"聂元梓（1921-2019）",b:"北京大学哲学系党总支书记。1966年5月25日与另外六人在北大贴出大字报，点名批判北大党委书记陆平等人。毛泽东下令向全国广播，此举点燃了全国范围的造反。聂后来成为北京红卫兵“五大领袖”之一，1983年被判处有期徒刑十七年。"},
  first:{m:["全国第一张马列主义大字报"],t:"“全国第一张马列主义的大字报”",b:"毛泽东对聂元梓大字报的评语。1966年6月1日晚中央人民广播电台播出这张大字报，次日《人民日报》全文刊登，并配发评论员文章《欢呼北大的一张大字报》。它向全国传递了一个信号，群众可以公开批判本单位的党组织。对工厂里受过气的人来说，这是十七年来第一次听到这样的话从喇叭里说出来。"},
  dzb:{m:["大字报"],t:"大字报",b:"用毛笔写在大张纸上、贴在公共场所的文字，是文革中最主要的群众表达方式。写谁、签不签名、贴在哪里，都可能决定一个人此后的命运。1975年宪法把“大鸣、大放、大辩论、大字报”写进了条文，1980年又删去。"},
  sanjia:{m:["三家村"],t:"三家村",b:"邓拓、吴晗、廖沫沙三人1961年起在北京市委刊物《前线》上合写杂文专栏“三家村札记”。1966年5月被定为“反党反社会主义”的黑店，遭全国批判。文革初期很多单位的大字报先批这类远处的目标，本单位的领导则不敢碰。"},
  gzd:{m:["工作队"],t:"工作队",b:"1966年6月，在毛泽东离京期间主持中央一线工作的刘少奇、邓小平决定向学校和工厂派驻工作队，领导运动。工作队普遍把矛头引向“牛鬼蛇神”和给党委提意见的群众。7月底毛泽东回京后批评工作队“压制群众”，下令撤出学校，此后“反工作队”成为造反派的正当性来源。国棉十七厂先后来过两支，6月20日纺织局派来的一支曾肯定王洪文的大字报，7月20日市委派来的一支则不再重用他。"},
  nggs:{m:["牛鬼蛇神"],t:"牛鬼蛇神",b:"文革中对各种“阶级敌人”的泛称，范围可以无限扩大，地主、富农、反革命、坏分子、右派，以及有“历史问题”的人都可以算进去。把运动的重点放在“横扫牛鬼蛇神”，往往意味着整的是普通群众，而不是当权者。"},
  dangan:{m:["档案袋"],t:"档案与黑材料",b:"中国城市单位中每人都有一份人事档案，由组织保管，本人不能查看，随人调动，决定入党、提干、分房等一切事务。文革初期工作队和党委收集群众的言行整理成材料装进档案，后来被称作“黑材料”。要求销毁黑材料，是1966年秋冬造反派最迫切的诉求之一。十年以后清查“三种人”，用的也是同一种纸袋。"},
  shiliu:{m:["《十六条》"],t:"《十六条》",b:"1966年8月8日八届十一中全会通过的《中共中央关于无产阶级文化大革命的决定》，共十六条。它规定运动的重点是“整党内那些走资本主义道路的当权派”，并警告不准把群众打成反革命。造反派普遍把它当作护身符。"},
  liao:{m:["廖祖康"],t:"廖祖康",b:"1948年生，国棉十七厂职业学校学生。文革初期带红卫兵为王洪文解围，此后一直追随他，后来成为王洪文在北京的生活秘书。他的回忆是关于王洪文私生活的重要来源，但网上流传的版本大多经过改写。"},
  hongqi:{m:["《红旗》杂志"],t:"《红旗》杂志",b:"中共中央理论刊物，文革中由陈伯达等人主持，与《人民日报》《解放军报》合称“两报一刊”，其社论往往代表最高层的最新意图。"},
  fdlx:{m:["资产阶级反动路线"],t:"资产阶级反动路线",b:"1966年10月《红旗》社论和中央工作会议正式提出的说法，指文革初期派工作队、打击群众的做法。一旦被定为“反动路线”，此前被整的群众就可以要求平反，此前整人的干部则要检讨。这个转向让大批基层造反派从“被整的人”变成了“正确的人”。"},
  hwb:{m:["红卫兵"],t:"红卫兵",b:"1966年起以大中学生为主的群众组织。8月起毛泽东在天安门多次接见红卫兵，全国“大串联”开始，学生免费乘车四处串联。北京学生到上海串联，是上海工人造反派早期的重要推动力。"},
  wxz:{m:["王秀珍"],t:"王秀珍（1934-2008）",b:"国棉三十厂工人，劳动模范，工总司早期骨干，后任上海市委书记，是文革中职位最高的上海女工之一。1982年8月21日被上海市高级人民法院判处有期徒刑十七年，1994年刑满释放。出生年份另有1935年一说。"},
  hjh:{m:["黄金海"],t:"黄金海（1935-2015）",b:"国棉三十一厂工人，1965年被评为上海市五好工人。文革初期因大字报被打成反党分子，愤而造反，是工总司的筹建者之一，后任上海市革委会常委。1976年后以“反革命罪”被判刑十五年，1991年出狱，晚年写成回忆录《十年非梦》。书名是对徐景贤《十年一梦》的回应。"},
  wuhao:{m:["五好工人"],t:"五好工人",b:"六十年代工厂里评比的荣誉称号，要求政治思想、完成任务、遵守纪律、团结互助、学习好。能当选的通常是车间里公认的积极分子。"},
  fandang:{m:["反党反社会主义分子"],t:"反党反社会主义分子",b:"一种政治定性。一旦被扣上，不仅本人在单位里抬不起头，档案里也会留下记录，家属同样受到影响。文革初期很多只是给基层党组织提意见的人都被这样定性。"},
  maoxuan:{m:["学毛选"],t:"学毛选",b:"学习《毛泽东选集》。六十年代全国推广“学毛著”运动，工厂车间普遍组织学习小组。批评党组织学毛选不认真，本来是站在最正确的立场上提意见，却照样可以被打成反党。"},
  pan:{m:["潘国平"],t:"潘国平（1946-2013）",b:"上海玻璃机械厂青年工人，工总司早期最活跃的领导人之一，人称“潘司令”，一度名气在王洪文之上。安亭谈判时他是和张春桥对话的主角。此后逐渐被边缘化，多次受到审查。他没有党员身份，也没有干部履历，这在工总司被吸纳进体制的过程中成了致命的短处。"},
  gzs:{m:["上海工人革命造反总司令部","工总司"],t:"工总司",b:"上海工人革命造反总司令部，1966年11月成立，王洪文为主要负责人。它是全国第一个被中央文革小组明确支持的跨行业、全市性工人造反组织。1967年后逐步体制化，骨干进入各级革委会，在上海政坛活跃了整整十年。1976年后，它的成员在清查中被逐个审查，很多人一辈子背着这个身份。"},
  cao:{m:["曹荻秋"],t:"曹荻秋（1909-1976）",b:"时任上海市长、市委书记处书记，市委第一书记陈丕显病休期间主持日常工作。对工总司采取“不参加、不承认、不支持”的方针。12月23日他又签字承认了赤卫队，两天后在造反派大会上宣布签字作废。1967年一月风暴后被打倒，1976年去世。两个多月里他对两派都签过字，又都收回过，这是上海市委在那个冬天的处境。"},
  sanbu:{m:["不参加，不承认，不支持"],t:"“三不”方针",b:"上海市委对工总司的态度。当时中央的规定是工人不得跨厂串联、不得成立跨行业组织，市委以此为依据。在造反派看来，这等于宣布他们非法。"},
  nzzz:{m:["北站"],t:"上海北站",b:"当时上海的铁路总站，沪宁线的起点。11月10日凌晨，工总司的工人从这里挤上北去的列车。"},
  anting:{m:["安亭"],t:"安亭",b:"上海嘉定县的一个小镇，沪宁铁路上的一个小站，离上海三十多公里。1966年11月10日上午8时17分，北上工人乘坐的列车奉命停在这里的岔道上，中午前后工人卧轨拦车，史称“安亭事件”。一个半月后，赤卫队北上告状，被拦在下一站附近的昆山。"},
  hn:{m:["沪宁线"],t:"沪宁铁路",b:"上海到南京的铁路，当时是全国最繁忙的干线之一，连接京沪线。安亭事件中它中断三十多个小时（一说二十小时），近百趟列车受阻，是震动中央的大事。"},
  cwd:{m:["赤卫队"],t:"赤卫队",b:"全称“捍卫毛泽东思想工人赤卫队上海总部”，1966年11月26日成立，保守派工人组织，号称最多有八十万人。成员多是党团员、劳模和车间积极分子，他们真心认为自己在保卫党和生产。他们也反对“资产阶级反动路线”，也写大字报揭发市委，只是不主张打倒市委。12月30日在康平路被工总司击溃，随后在全市被取缔，许多成员被抓、被斗，此后很长时间抬不起头。"},
  cbd:{m:["陈伯达"],t:"陈伯达（1904-1989）",b:"毛泽东的长期秘书，中央文革小组组长，《红旗》杂志总编辑。安亭事件时亲笔起草电报劝工人回上海，说“有问题就地解决”。这份电报后来被毛泽东、江青、张春桥否定。1970年庐山会议后倒台。"},
  zcq:{m:["张春桥"],t:"张春桥（1917-2005）",b:"上海市委书记处书记、中央文革小组副组长。安亭事件中他未经华东局和上海市委同意，签字承认工总司合法，由此在上海建立起自己的群众基础，王洪文也由此进入他的视野。毛泽东事后认可他“先斩后奏”。1967年起任上海市革委会主任。后为“四人帮”成员，1981年被判处死刑缓期执行，在法庭上始终不发一言。"},
  zyw:{m:["中央文革小组"],t:"中央文革小组",b:"1966年5月成立，名义上隶属政治局常委会，实际上成为文革的指挥中枢。组长陈伯达，顾问康生，第一副组长江青，副组长张春桥等。它对哪个群众组织表态支持，几乎决定该组织的命运。"},
  hdj:{m:["华东局"],t:"华东局",b:"中共中央华东局，中央派驻华东地区的领导机构，地位在上海市委之上。安亭事件中它与上海市委都主张不承认工总司。"},
  wuxiang:{m:["五项要求"],t:"五项要求",b:"11月13日张春桥在文化广场签字同意的工总司要求，原文五条。一，承认上海市工人革命造反总司令部是合法的组织。二，承认“一一·九”大会以及被迫上北京控告是革命的行动。三，这次所造成的后果，全部由华东局、上海市委负完全责任。四，曹荻秋必须向群众作公开检查。五，对上海市工人革命造反总司令部今后工作提供各方面方便。它推翻了市委此前的全部立场，也打破了“工人不得成立跨行业组织”的禁令。"},
  qincheng:{m:["秦城"],t:"秦城监狱",b:"位于北京昌平，关押高级别政治犯的监狱。王洪文1976年被捕后在此关押，1981年被判处无期徒刑，1986年后因病转院治疗，1992年8月3日病逝。"},
  baopao:{m:["包炮"],t:"包炮",b:"上海红卫兵“红三司”的学生领袖，安亭谈判时在场，不时帮两方说话，据谢鹏飞回忆曾当面顶撞张春桥。后来成为雕塑家，改名包泡。RFA有他的访谈。"},
  xiepf:{m:["谢鹏飞"],t:"谢鹏飞",b:"工总司早期骨干之一，参加了安亭谈判，他的回忆是谈判经过的主要来源之一。"},
  geng:{m:["耿金章"],t:"耿金章",b:"原名耿玉章，山东人。当过国民党军上等兵，济南战役中被俘，随即参加解放军，升到副排长，1949年入党，1957年复员到上海，在造纸厂当打浆工，1964年提为副工长。安亭事件后一说他带人步行到了苏州。康平路那一夜，他是冲击赤卫队的现场指挥。此后他的“二兵团”迅速膨胀，号称五六十万人，名义上归工总司，实际上不听王洪文指挥。1967年2月被王洪文设局抓起来，二兵团瓦解。1973年张春桥说他犯的是王明、陈独秀那样的“分裂主义”错误。他代表了工人造反派里另一种人，比王洪文年纪大，出身更复杂，更不听话，也更早被收拾。"},
  xianfa:{m:["第八十七条"],t:"1954年宪法第八十七条",b:"条文是“中华人民共和国公民有言论、出版、集会、结社、游行、示威的自由。国家供给必需的物质上的便利，以保证公民享受这些自由。”安亭事件后，11月14日的中央会议上，毛泽东拿出宪法中关于结社自由的条文，为张春桥承认工总司辩护。这是文革中极少数“宪法条文被最高层当众引用来保护群众组织”的时刻。可同样的条文，一个多月后并没有被拿来保护赤卫队。"},
  lianguo:{m:["面包收条"],t:"面包收条",b:"叶永烈说他在写《王洪文传》时找到过一张1966年11月10日安亭的面包收条签名单。市委和铁路局一边扣车，一边给车上的人送吃的。这类单据后来成了清查时认定“谁去过安亭”的证据之一。"},

let GLIST = [];
function rebuildGlist(){ GLIST = Object.entries(GLOSS).flatMap(([k,v])=>v.m.map(x=>[x,k])).sort((a,b)=>b[0].length-a[0].length) }
rebuildGlist();
function glossPart(html, used, slots){
  for(const [term,key] of GLIST){
    if(used.has(key)) continue;
    let from = 0, idx = -1;
    while(true){
      idx = html.indexOf(term, from);
      if(idx<0) break;
      const before = html.slice(0,idx);
      if(before.lastIndexOf("<")>before.lastIndexOf(">")){ from = idx+term.length; continue }
      break;
    }
    if(idx<0) continue;
    used.add(key);
    slots.push(`<button type="button" class="g" data-g="${key}">${term}</button>`);
    html = html.slice(0,idx) + "\u0000"+(slots.length-1)+"\u0000" + html.slice(idx+term.length);
  }
  return html;
}
function gloss(html){
  const slots=[]; const used=new Set();
  const parts = html.split(/(<figure[\s\S]*?<\/figure>)/);
  const out = parts.map(p => p.startsWith("<figure") ? p : glossPart(p, used, slots)).join("");
  used.forEach(k=>{ if(!st.seen.includes(k)) st.seen.push(k) });
  return out.replace(/\u0000(\d+)\u0000/g,(_,i)=>slots[+i]);
}
const sheet = document.getElementById("sheet");
function openGloss(key){
  const g = GLOSS[key]; if(!g) return;
  sheet.querySelector("h4").textContent = g.t;
  sheet.querySelector("p").textContent = g.b;
  sheet.hidden = false;
  sheet.querySelector(".x").focus();
}
const lightbox = document.getElementById("lightbox");
function openZoom(fig){
  const svg = fig.querySelector("svg"); if(!svg) return;
  const body = lightbox.querySelector(".lb-body");
  body.innerHTML = ""; body.appendChild(svg.cloneNode(true));
  lightbox.hidden = false; document.getElementById("lb-x").focus();
}
document.addEventListener("click",e=>{
  const b = e.target.closest(".g"); if(b){ openGloss(b.dataset.g); return }
  if(e.target.closest("#sheet .x")) sheet.hidden = true;
  const z = e.target.closest(".zoom"); if(z){ openZoom(z.closest("figure")); return }
  if(e.target.closest("#lb-x") || e.target===lightbox) lightbox.hidden = true;
});
document.addEventListener("keydown",e=>{ if(e.key==="Escape"){ sheet.hidden=true; lightbox.hidden=true } });

const TAGS = {photo:`<span class="tag photo">历史照片</span>`, recon:`<span class="tag recon">依据史料的复原</span>`, illus:`<span class="tag illus">游戏插画</span>`};
function fig(kind, svg, cap, label){
  return `<figure class="art"><button type="button" class="zoom" aria-label="放大查看：${label}">${svg}</button><figcaption>${TAGS[kind]}${cap}</figcaption></figure>`;
}
function scribble(x,y,w,seed){
  // a row of ink blocks that reads as handwriting from a distance
  let d = "", cx = x, s = seed;
  while(cx < x+w-8){ s = (s*9301+49297)%233280; const len = 9 + (s%13); d += `M${cx} ${y}h${Math.min(len, x+w-cx)}`; cx += len + 5 + (s%4); }
  return d;
}

};

  const P = {

SC.p1 = {
  act:1, tl:0,
  stamp:"1966年6月 · 初夏", place:"杨树浦 · 国棉十七厂",
  title:"广播",
  text:()=>`
<p>国棉十七厂的前身是日本人的裕丰纱厂。八千多人，三班倒，机器二十四小时不停。你在保卫科上班，管民兵，管门卫，管厂里丢了东西以后的调查。你一个月拿六十四元，家里有老婆崔根娣和孩子。</p>
<p>六月初的一天，中午，厂里的大喇叭突然念起一张大字报。北京大学的聂元梓，写大字报点名批评北大党委。念完以后，喇叭里接着念《人民日报》的评论员文章。第二天厂里就传开了，说毛主席亲自批示，称它是全国第一张马列主义大字报。</p>
<p>食堂里一下子安静了。有人筷子停在半空。</p>
<p>你听得很仔细。你想的是，原来党委也是可以批评的。原来报纸上说的，是这个意思。</p>
<p>厂里平时有些事，大家心里都有数，只是没人敢说。谁家亲戚进了厂，谁评先进是走了关系，谁在车间里对女工动手动脚没人管。你是保卫科的人，这些事你知道得比别人多。</p>
<p>那几天，厂里开始有人贴大字报了。贴的都是些不痛不痒的，批批“三家村”，批批历史上的人物。没有人碰厂党委。</p>`,
  choices:[

  ],
  src:`<p><span class="tag hist">史实</span> 国棉十七厂前身是日商裕丰纱厂，文革时有八千多名职工；王洪文时为保卫科干事，月工资64元。见李逊〈工厂基层干部王洪文〉（《革命造反年代》第六章）。</p>
<p><span class="tag hist">史实</span> 1966年6月1日，中央人民广播电台播出聂元梓等人的大字报，次日《人民日报》全文刊登并配发评论员文章。这一事件在全国工厂学校引发了第一波贴大字报的浪潮。</p>

SC.p3 = {
  act:1, tl:0,
  stamp:"1966年7月至10月", place:"国棉十七厂",
  title:"工作队",
  text:()=>`
<p>局里的工作队只待了一个月。七月二十日，市委派来一支新的，一百五十来人，队长是市总工会的副主席施惠珍。局里那一支第二天就撤走了，走的时候没跟你们打招呼。</p>
<p>新工作队的报告你听了三遍，越听越不对劲。报告里说，运动的重点是“搜索一切牛鬼蛇神”，要全厂职工“到深山密林中寻老虎”。你们揭发的那些事，报告里一个字都没提。</p>

<p>你在保卫科干了六年，你比谁都清楚档案袋意味着什么。那几页纸会跟着一个人走一辈子，调动、入党、提干、分房子，每一次都要被翻出来看。而本人永远看不到上面写了什么。</p>

<p>后来是厂里职业学校的一群学生冲进来，把你拉了出去。带头的那个孩子才十八岁，叫廖祖康。</p>`,

<p><span class="tag hist">史实</span> 工作队报告强调“搜索一切牛鬼蛇神”“到深山密林中寻老虎”；工作队组织了四次全厂大辩论，10月10日王洪文被围，职校学生廖祖康带红卫兵解围。王洪文读《十六条》后说“好像中央在直接指我们厂的形势”。均见李逊书第六章。</p>
<p><span class="tag fict">虚构</span> 吐唾沫的保全工、保卫科同事的告密为游戏演绎。这个保全工在第二幕还会出现。</p>`

  text:()=>`

<p>北京和上海完全是两个世界。满大街都是红卫兵，大字报贴满了每一面墙。你听说中央刚刚开过会，《红旗》杂志发了社论，批判“资产阶级反动路线”。那些派工作队整群众的做法，现在有了一个名字，叫反动路线。被整的人可以要求平反，黑材料要当众销毁。</p>

  if(o==="home") return `一个人在11月9日退出，并不改变安亭事件的发生。工总司的崛起有其结构原因，市委的“三不”方针、中央文革对工人组织的需要、工厂内部积累的矛盾，这些都不取决于某一个人。值得追问的是，那些没有走出去的人，在后来的清查中和改制中又经历了什么。`;
  if(o==="fall") return `个人的缺席同样不改变结构。工总司在11月13日得到承认，是中央文革的政治需要与张春桥个人判断的结果。站台上那个人的受伤，在任何一种主流叙述里都不会留下记录。`;
  s.push(`安亭事件是上海工人造反派崛起的起点。工总司的合法化，首先得益于中央文革的政治需要，张春桥在未经华东局与市委同意的情况下签字，改变了此后上海的权力格局。`);
  s.push(L==="self"?`从领导层构成看，这一次党员、干部身份占了上风，这也解释了后来为什么同为造反派，有人被整肃，有人被吸纳进体制。`:L==="pan"?`这一次领导层由没有党员身份的年轻工人主导，可以设想，工总司后来被吸纳进体制的过程会更加曲折。`:`集体领导的设想，与巴黎公社原则在文革初期的动员作用有关；但这些原则在后来的权力重组中逐渐蜕变。`);
  s.push(T==="dis"?`在现场持保留意见的人并不少见，他们的声音在两种主流叙述中都很少被记录。值得注意的是，王洪文本人在1980年受审时，恰恰把自己描述成这样的人。`:``);
  s.push(o==="hard"?`不肯回去的那部分人后来成为耿金章“二兵团”的班底。造反派内部从一开始就不是一块。`:``);
  if(has("cite_const")) s.push(`援引宪法为群众组织辩护，在当时并非没有先例，毛泽东本人就在11月14日这样做过。问题在于这种援引是否对所有组织一视同仁。`);
  return s.join("");
}
function rel1(){
  const o = outcome1();
  const r = [];
  r.push(["潘国平", o==="home" ? "后来你在报上看到他的名字，登了两年，又没有了。" : o==="fall" ? "他来医院看过你，站在床尾，说了句好好养着，就走了。" :
    has("lead_self") ? (o==="deal" ? "他后来也去了苏州。临走前没跟你打招呼。" : o==="hard" ? "他在苏州见到你，愣了一下，说想不到你也来了。" : "他谈下了协议，在人群里被人扛了起来。")
    : (o==="pan"||has("lead_pan") ? "他叫你“老王”，拍着你的肩膀说，没有你稳住后面，他在前面什么也干不成。" : "他看你的眼神有点复杂。")]);
  r.push(["黄金海", o==="home" ? "他没有来找你。后来听说他坐了十五年牢。" :
    has("dissent") ? "他那天晚上没有跟你坐在一起，但第二天早上给你带了一个馒头。" : "他在回上海的车上一直跟你说话，说回去以后要办一张报纸。"]);
  r.push(["张春桥", o==="home"||o==="fall" ? "你没有见过他。" : has("deal") ? "他记住了你的名字。" : has("hard") ? "他在苏州又见到你，在本子上写了几个字，你没看清。" : has("cite_const") ? "你念宪法的时候，他在台上抬头看了你一眼。" : "他跟你握过一次手。"]);
  if(has("hard")) r.push(["耿金章", "他在苏州管你叫老王。一个多月以后，他手下的人比工总司还多。"]);
  r.push(["周月娥", has("talked") ? "那天她下车问了那个认得的人。她后来没有赶到南京。" : "她在车上坐到第二天下午。母亲的事，她后来一直没跟人提起那天。"]);
  r.push(["陆根宝", "他回厂以后参加了赤卫队的成立大会。十一月二十六日，他在袖章上用红漆写了自己的名字。"]);
  return r;
}
const HIST1 = `<p>历史上，11月6日工总司在愚园路筹备；9日在文化广场开成立大会，曹荻秋没有到场，会场一度混乱；10日凌晨工人冲进北站北上，8时17分列车停在安亭，中午前后工人卧轨拦车，沪宁线中断三十多小时（一说二十小时）。11日中午陈伯达来电劝返，当夜张春桥赶到安亭谈判。12日多数人回沪。13日张春桥在文化广场签下五项要求，承认工总司合法、安亭事件为革命行动。15日他又在苏州对不肯回来的人签字。14日毛泽东在中央会议上认可了张春桥的“先斩后奏”，并念了宪法里关于结社自由的条文。</p>
<p>这件事让工总司合法化，也让王洪文从一个工厂保卫干事，开始进入张春桥的视野。</p>`;

/* ---------- endings registry ---------- */
const ENDS = {
  1:{ key:"end", outcome:outcome1, lens:lens1, rel:rel1, hist:()=>HIST1,
      title:o=>o==="home"?"你没有去安亭":o==="fall"?"站台下面":"安亭之后",
      open:o=> o==="home" ? `<p>你醒过来。同一件事，有好几种讲法。</p>` :
        `<p>你醒过来。同一件事，有好几种讲法。</p><blockquote>1980年6月5日，审讯室。问，安亭拦车你是什么责任。答，我没有拦车，我是劝阻不力，负领导责任。</blockquote><p class="aside">这是王洪文受审时的说法，据王锐〈“安亭事件”的再认识和再研究〉转述，原笔录待原文。你这一局在安亭做了什么，可以和这句话对照着看。</p>`,
      next:o=> (o==="home"||o==="fall") ? null : "b0",
      nextLabel:"第二幕　夺权" }
};

/* ---------- render ---------- */
const app = document.getElementById("app");
function setChrome(sc){
  const act = sc && sc.act || st.act || 1;
  root.dataset.act = st.scene==="title" ? "1" : (sc && sc.tone) || (st.scene.startsWith("end") ? "0" : String(act));
  document.getElementById("actname").textContent = st.scene==="title" ? "梦与非梦" : "梦与非梦 · " + (ACTS[act]||"");
  document.getElementById("dreams").innerHTML = st.scene==="title"
    ? (dreamCount>0 ? `你已经梦见安亭 <b>${dreamCount}</b> 次` : ``)
    : `这是你第 <b>${Math.max(dreamCount,1)}</b> 次梦见安亭`;
}
const TL = {1:["1966.6","11.6","11.9","11.10","11.12","11.13"], 2:["11.30","12.23","12.30","1967.1","1.19","2.5","2.24"]};
function timeline(sc){
  if(sc.tl===undefined) return "";
  const arr = TL[sc.act||1]; if(!arr) return "";
  return `<div class="timeline" aria-hidden="true">${arr.map((d,i)=>`<span class="${i<=sc.tl?"on":""}">${d}</span>`).join("")}</div>`;
}
function render(){
  if(!SC[st.scene] && st.scene!=="title" && !st.scene.startsWith("end")) st.scene = "title";
  const sc = SC[st.scene];
  setChrome(sc);
  if(st.scene==="title") return renderTitle();
  if(st.scene.startsWith("end")) return renderEnd();
  const choices = typeof sc.choices==="function" ? sc.choices() : (sc.choices||[]);
  let html = `<div class="fade ${sc.persona?"persona":""}">
    ${timeline(sc)}
    <div class="stamp">${sc.stamp}</div><div class="place">${sc.place}</div>
    <h2>${sc.title}${sc.persona?'<span class="tag fict">插曲</span>':''}${sc.death?'<span class="tag disp">死局</span>':''}</h2>
    <div class="story">${gloss(sc.text())}</div>`;
  if(sc.death && sc.verdict){
    const v = sc.verdict();
    html += `<div class="verdict"><h3>${v.title}</h3><div class="vbody">${v.lines.map(l=>`<p>${l}</p>`).join("")}</div><div class="vseal">${v.seal}</div></div>`;
  }
  if(sc.end || sc.death){
    html += `<div class="choices"><button class="choice" id="c-end" data-end="1">醒来</button></div>`;
  } else {
    html += `<div class="choices">` + choices.map((c,i)=>{
      const t = typeof c.t==="function"?c.t():c.t;
      if(c.lock) return `<button class="choice locked" id="c-${st.scene}-${i}" aria-disabled="true">${t}<span class="why">${c.lock}</span></button>`;
      return `<button class="choice${c.grown?" grown":""}" id="c-${st.scene}-${i}" data-i="${i}">${t}</button>`;
    }).join("") + `</div>`;
  }
  html += toolbar(sc.src) + `</div>`;
  app.innerHTML = html;
  wire(choices, sc);
}
function toolbar(src){
  return `<div class="bar">
    <button class="tbtn" id="t-arch" aria-pressed="${st.tab==='arch'}">档案</button>
    ${src?`<button class="tbtn" id="t-src" aria-pressed="${st.tab==='src'}">史料注</button>`:""}
    <button class="tbtn" id="t-gl" aria-pressed="${st.tab==='gl'}">词条</button>
  </div>
  ${st.tab==='gl'?glossPanel():''}
  ${st.tab==='arch'?archivePanel():''}
  ${st.tab==='src'&&src?`<div class="panel src"><h3>这一段依据什么</h3>${src}</div>`:''}`;
}
function glossPanel(){
  const items = st.seen.filter(k=>GLOSS[k]).map(k=>`<button type="button" class="g" data-g="${k}">${GLOSS[k].t}</button>`).join("");
  return `<div class="panel"><h3>到目前为止出现过的人物和事件</h3><div class="glist">${items||"还没有。"}</div></div>`;
}
let stampNow = false;
function archivePanel(){
  const rows = st.archive.filter(r=>r.a66!==null || r.a77!==null);
  let items = rows.length ? rows.map(r=>{
    if(st.y77) return r.a77 ? `<li class="y77">${r.a77}</li>` : `<li class="y77 empty">（清查材料中无此项记录）</li>`;
    return r.a66 ? `<li>${r.a66}</li>` : `<li class="empty">（当年未记）</li>`;
  }).join("") : `<li class="empty">档案袋还是空的。</li>`;
  const cls = stampNow ? " stamping" : "";
  const env = stampNow ? " flip" : "";
  stampNow = false;
  return `<div class="envelope${env}">
    <div class="seal ${st.y77?"s77":"s66"}${cls}">${st.y77?"一九七七 · 清查":"一九六六 · 存档"}</div>
    <div class="env-label"><b>王洪文</b>国棉十七厂保卫科　个人档案　本人不得查阅</div>
    <div class="env-sw">
      <button class="tbtn" id="y66" aria-pressed="${!st.y77}">1966年的写法</button>
      <button class="tbtn" id="y77" aria-pressed="${st.y77}">1977年的写法</button>
    </div><ul class="arch">${items}</ul></div>`;
}
function go(next){
  st.scene = next; st.tab = null;
  const sc = SC[next]; if(sc && sc.act) st.act = sc.act;
  save(); render(); window.scrollTo({top:0});
}
function wire(choices, sc){
  app.querySelectorAll(".choice[data-i]").forEach(b=>b.addEventListener("click",()=>{
    const c = choices[+b.dataset.i];
    if(c.set) st.facts.push(c.set);
    if(c.a66!==null || c.a77!==null) st.archive.push({a66:c.a66, a77:c.a77});
    go(c.next);
  }));
  const e = document.getElementById("c-end");
  if(e) e.addEventListener("click",()=>{ st.lens="huang"; go(sc.endKey || (sc.act===2?"end2":"end")); });
  bindBar();
}
function bindBar(){
  const a = document.getElementById("t-arch"), s = document.getElementById("t-src");
  if(a) a.onclick=()=>{ st.tab = st.tab==='arch'?null:'arch'; save(); render() };
  if(s) s.onclick=()=>{ st.tab = st.tab==='src'?null:'src'; save(); render() };
  const gl = document.getElementById("t-gl");
  if(gl) gl.onclick=()=>{ st.tab = st.tab==='gl'?null:'gl'; save(); render() };
  const y6=document.getElementById("y66"), y7=document.getElementById("y77");
  if(y6) y6.onclick=()=>{ if(st.y77){ st.y77=false; stampNow=true } save(); render() };
  if(y7) y7.onclick=()=>{ if(!st.y77){ st.y77=true; stampNow=true } save(); render() };
}
function startDream(){
  bumpDream();
  st = fresh(); st.scene = "p1"; st.act = 1;
  save(); render(); window.scrollTo({top:0});
}
function renderTitle(){
  const canResume = saved && saved.scene && saved.scene!=="title" && (SC[saved.scene] || String(saved.scene).startsWith("end"));
  app.innerHTML = `<div class="fade">
    <h1>梦与非梦<small>上海　1966 至 1967</small></h1>
    <div class="story">
      <p>秦城监狱，八十年代的某一夜。走廊的灯一夜不关。</p>
      <p>你又梦见那年冬天。愚园路那间烟雾弥漫的屋子，文化广场上的几万人，安亭站两根冰冷的铁轨，康平路那一地袖章。</p>
      <p>梦里的事可以不一样。醒来以后，档案还是那份档案。</p>
    </div>
    <p class="note-start">这个游戏没有数值。游戏只记住你做过什么，以及别人怎么记住你。每一段都可以打开“史料注”，看哪些是史实、哪些有争议、哪些是虚构。现在可以玩第一幕“安亭”和第二幕“夺权”。</p>
    <div class="choices">
      <button class="choice" id="start">入梦</button>
      ${canResume?`<button class="choice" id="resume">接着上一次的梦</button>`:""}
    </div>
  </div>`;
  document.getElementById("start").onclick = startDream;
  const r = document.getElementById("resume");
  if(r) r.onclick = ()=>{ st = Object.assign(fresh(), saved); saved = null; render(); window.scrollTo({top:0}); };
}
function renderEnd(){
  const E = st.scene==="end2" ? ENDS[2] : ENDS[1];
  const o = E.outcome();
  const r = E.rel();
  const tab = st.lens;
  let body="";
  if(tab==="huang"||tab==="xu"||tab==="li"){
    const name = {huang:"战友的讲法　仿黄金海《十年非梦》的立场",xu:"官员的讲法　仿徐景贤《十年一梦》的立场",li:"研究者的讲法　仿李逊《革命造反年代》的立场"}[tab];
    body = `<div class="lens"><h3 style="font-family:var(--sans);font-size:13px;color:var(--muted);font-weight:500;margin:0">${name}</h3>
      <p>${E.lens(tab)}</p>
      <p class="disclaim">以上为依据各书立场的仿写，不是原文，也不代表作者真实说过这些话。</p></div>`;
  } else if(tab==="rel"){
    body = `<div class="rel">${r.map(([n,t])=>`<div><b>${n}</b><span>${t}</span></div>`).join("")}</div>`;
  } else if(tab==="hist"){
    body = gloss(`<div class="lens">${E.hist(o)}</div>`);
  }
  const nxt = E.next(o);
  app.innerHTML = `<div class="fade">
    <div class="stamp">198?年 · 夜</div><div class="place">秦城监狱</div>
    <h2>${E.title(o)}</h2>
    <div class="story">${gloss(E.open(o))}</div>
    <div class="tabs" role="tablist">
      ${[["huang","战友"],["xu","官员"],["li","研究者"],["rel","人物"],["hist","史实"]].map(([k,n])=>`<button class="tbtn" id="lens-${k}" aria-pressed="${tab===k}" data-k="${k}">${n}</button>`).join("")}
    </div>
    <div class="panel">${body}</div>
    <div class="bar"><button class="tbtn" id="t-arch" aria-pressed="${st.tab==='arch'}">档案</button><button class="tbtn" id="t-gl" aria-pressed="${st.tab==='gl'}">词条</button></div>
    ${st.tab==='arch'?archivePanel():''}${st.tab==='gl'?glossPanel():''}
    ${nxt && SC[nxt] ? `<button class="restart" id="next">下一幕　${E.nextLabel.replace(/^第.幕　/,"")}</button>` : (nxt ? `<p class="note-start">下一幕尚未制作。</p>` : `<p class="note-start">这一局的梦停在这里。</p>`)}
    <button class="restart ${nxt&&SC[nxt]?"alt":""}" id="again">再做一次梦</button>
  </div>`;
  app.querySelectorAll("[data-k]").forEach(b=>b.onclick=()=>{ st.lens=b.dataset.k; save(); render(); });
  bindBar();
  const n = document.getElementById("next");
  if(n) n.onclick=()=>{ st.lens="huang"; st.y77=false; go(nxt); };
  document.getElementById("again").onclick = startDream;
}
if(window.claude && window.claude.hot && window.claude.hot.snapshot){
  try{ window.claude.hot.snapshot(()=>({st})) }catch(e){}
}
render();
})();
</script>
