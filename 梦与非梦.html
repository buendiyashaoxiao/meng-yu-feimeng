<!doctype html>
<html lang="zh-CN" data-act="1">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>梦与非梦</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;700;900&family=Noto+Sans+SC:wght@400;500&family=IBM+Plex+Mono:wght@400;500&family=Ma+Shan+Zheng&display=swap">
<style>
/* Layout: one reading column like a stack of carbon-copied forms; choices are tear-off slips; archive and sources fold out below. */
:root{
  --paper:#e8ecea; --slip:#f6f8f6; --ink:#1c2321; --muted:#5a6661;
  --carbon:#2b3d8c; --stamp:#9e2f28; --rule:#c3cbc7; --fict:#7a5a12;
  --kraft:#c8a36b; --kraft2:#b48d55; --kraft-ink:#2a1e0e; --water:#bfd0d6; --land:#dde3df; --wall:#b8b2a5;
  --serif:"Noto Serif SC","Songti SC","SimSun",serif;
  --sans:"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --brush:"Ma Shan Zheng","STKaiti","KaiTi",var(--serif);
}
/* act tones, light */
:root[data-act="2"]{--paper:#dfe1e3; --slip:#f1f2f3; --carbon:#34465e; --land:#d6d9dc}
:root[data-act="2r"]{--paper:#ebe3df; --slip:#f7f2f0; --carbon:#a3261c; --land:#e2dad5}
:root[data-act="0"]{--paper:#d9dcdb; --slip:#e9ecea}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#121615; --slip:#1a201e; --ink:#dde3e0; --muted:#8e9a95;
    --carbon:#93a6f2; --stamp:#e27a70; --rule:#2c3432; --fict:#d8b25e;
    --kraft:#5b4527; --kraft2:#4a381f; --kraft-ink:#f0e2c8; --water:#1f3440; --land:#1a1f1e; --wall:#35322d; color-scheme:dark}
  :root[data-act="2"]:not([data-theme="light"]){--paper:#0f1114; --slip:#171a1f; --carbon:#9fb3d6; --land:#16191d}
  :root[data-act="2r"]:not([data-theme="light"]){--paper:#171111; --slip:#211818; --carbon:#f08a7c; --land:#1d1616}
  :root[data-act="0"]:not([data-theme="light"]){--paper:#0b0c0c; --slip:#131515}
}
:root[data-theme="dark"]{
  --paper:#121615; --slip:#1a201e; --ink:#dde3e0; --muted:#8e9a95;
  --carbon:#93a6f2; --stamp:#e27a70; --rule:#2c3432; --fict:#d8b25e;
  --kraft:#5b4527; --kraft2:#4a381f; --kraft-ink:#f0e2c8; --water:#1f3440; --land:#1a1f1e; --wall:#35322d; color-scheme:dark}
:root[data-theme="dark"][data-act="2"]{--paper:#0f1114; --slip:#171a1f; --carbon:#9fb3d6; --land:#16191d}
:root[data-theme="dark"][data-act="2r"]{--paper:#171111; --slip:#211818; --carbon:#f08a7c; --land:#1d1616}
:root[data-theme="dark"][data-act="0"]{--paper:#0b0c0c; --slip:#131515}
*{box-sizing:border-box}
html,body{margin:0}
html{overflow-x:hidden}
[hidden]{display:none!important}
body{background:var(--paper);color:var(--ink);font-family:var(--serif);font-size:17px;line-height:1.85;transition:background .4s}
.wrap{max-width:42rem;margin:0 auto;padding-inline:16px;padding-block:28px 64px}
header.top{display:flex;justify-content:space-between;align-items:baseline;gap:8px 12px;flex-wrap:wrap;
  font-family:var(--mono);font-size:12px;letter-spacing:.06em;color:var(--muted);border-bottom:1px solid var(--rule);padding-bottom:10px}
header.top b{color:var(--ink);font-weight:500}
header.top .right{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.stamp{font-family:var(--mono);font-size:13px;letter-spacing:.05em;color:var(--carbon);margin-top:28px}
.place{font-family:var(--sans);font-size:13px;color:var(--muted);margin-top:2px}
h1{font-weight:900;font-size:clamp(2.4rem,9vw,3.6rem);line-height:1.1;letter-spacing:.04em;margin:40px 0 8px;text-wrap:balance}
h1 small{display:block;font-family:var(--sans);font-weight:400;font-size:1rem;letter-spacing:.2em;color:var(--muted);margin-top:14px}
h2{font-weight:700;font-size:1.35rem;margin:6px 0 0;text-wrap:balance}
.story p{margin:1em 0}
.story .aside{font-family:var(--sans);font-size:14px;color:var(--muted)}
.story blockquote{margin:1em 0;padding:4px 0 4px 14px;border-left:2px solid var(--carbon);font-size:16px}
.persona .story{font-family:var(--sans);font-size:16px;line-height:1.95}
.persona h2{font-family:var(--sans);font-weight:500}
.tag{display:inline-block;font-family:var(--sans);font-size:11px;letter-spacing:.08em;padding:1px 7px;border:1px solid currentColor;border-radius:2px;margin-left:8px;vertical-align:2px;line-height:1.6}
.tag.fict{color:var(--fict)} .tag.hist{color:var(--carbon)} .tag.disp{color:var(--stamp)}
.tag.recon{color:var(--carbon);border-style:dashed} .tag.illus{color:var(--fict);border-style:dashed} .tag.photo{color:var(--ink)}
figcaption .tag{margin-left:0;margin-right:6px}
.choices{display:grid;gap:12px;margin-top:28px}
.choice{all:unset;box-sizing:border-box;display:block;cursor:pointer;background:var(--slip);color:var(--ink);
  padding:14px 18px;border-top:2px dashed var(--rule);font-family:var(--serif);font-size:16px;line-height:1.7;transition:transform .15s,border-color .15s}
.choice:hover{border-top-color:var(--carbon);transform:translateX(3px)}
.choice:focus-visible{outline:2px solid var(--carbon);outline-offset:3px}
.choice .who{display:block;font-family:var(--sans);font-size:12px;color:var(--muted);margin-bottom:2px}
.choice.locked{cursor:default;opacity:.62}
.choice.locked:hover{transform:none;border-top-color:var(--rule)}
.choice.locked .why{display:block;font-family:var(--sans);font-size:13px;color:var(--stamp);margin-top:4px}
.choice.grown{border-top-color:var(--fict)}
.choice.grown::before{content:"梦里多出来的一条路";display:block;font-family:var(--sans);font-size:11px;letter-spacing:.1em;color:var(--fict);margin-bottom:2px}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-top:40px;border-top:1px solid var(--rule);padding-top:14px}
.tbtn{all:unset;cursor:pointer;font-family:var(--sans);font-size:13px;padding:5px 12px;border:1px solid var(--rule);border-radius:3px;color:var(--muted)}
.tbtn[aria-pressed="true"]{color:var(--carbon);border-color:var(--carbon)}
.tbtn:focus-visible{outline:2px solid var(--carbon);outline-offset:2px}
.hbtn{all:unset;cursor:pointer;font-family:var(--mono);font-size:12px;color:var(--muted);border-bottom:1px dotted var(--muted)}
.hbtn:focus-visible{outline:2px solid var(--carbon)}
.panel{margin-top:16px;background:var(--slip);padding:16px 18px;font-size:15px}
.panel h3{font-family:var(--sans);font-size:12px;font-weight:500;letter-spacing:.12em;color:var(--muted);margin:0 0 10px}
.arch{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.arch li{font-family:var(--mono);font-size:13.5px;line-height:1.7;border-left:2px solid currentColor;padding-left:12px;overflow-wrap:anywhere}
.arch li.y77{border-left-color:var(--stamp)}
.arch .empty{opacity:.7}
/* kraft file envelope */
.envelope{position:relative;margin-top:16px;background:var(--kraft);color:var(--kraft-ink);padding:64px 18px 20px;border-radius:3px;
  box-shadow:0 1px 0 rgba(0,0,0,.15),0 8px 18px -10px rgba(0,0,0,.4);overflow:hidden}
.envelope::before{content:"";position:absolute;left:0;right:0;top:0;height:46px;background:var(--kraft2);clip-path:polygon(0 0,100% 0,100% 40%,50% 100%,0 40%)}
.envelope::after{content:"";position:absolute;left:calc(50% - 9px);top:30px;width:18px;height:18px;border-radius:50%;border:2px solid var(--kraft-ink);opacity:.55}
.env-label{position:relative;font-family:var(--mono);font-size:12px;letter-spacing:.08em;border:1px solid currentColor;padding:6px 10px;margin:0 0 14px;max-width:26rem;background:rgba(255,255,255,.08)}
.env-label b{font-family:var(--serif);font-size:15px;letter-spacing:.2em;display:block}
.env-sw{position:relative;display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.envelope .tbtn{color:var(--kraft-ink);border-color:currentColor;opacity:.7}
.envelope .tbtn[aria-pressed="true"]{opacity:1;background:rgba(0,0,0,.12)}
.seal{position:absolute;right:12px;top:8px;z-index:1;font-family:var(--sans);font-weight:500;font-size:13px;letter-spacing:.15em;padding:4px 10px;
  border:3px double currentColor;border-radius:4px;transform:rotate(-11deg);opacity:.85;pointer-events:none}
.seal.s66{color:var(--carbon)} .seal.s77{color:var(--stamp)}
.seal.stamping{animation:stampin .5s cubic-bezier(.2,1.6,.4,1)}
@keyframes stampin{0%{transform:rotate(-11deg) scale(2.4);opacity:0}60%{opacity:.95}100%{transform:rotate(-11deg) scale(1);opacity:.85}}
.envelope.flip .arch{animation:flip .4s ease-out}
@keyframes flip{from{transform:perspective(600px) rotateX(-40deg);opacity:0}to{transform:none;opacity:1}}
.src p{margin:.4em 0;font-family:var(--sans);font-size:14px;line-height:1.7}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:28px 0 0}
.lens{margin-top:14px}
.lens p{margin:.8em 0}
.lens .disclaim{font-family:var(--sans);font-size:13px;color:var(--fict)}
.rel{display:grid;gap:12px;margin-top:14px}
.rel div{display:grid;grid-template-columns:5.5em 1fr;gap:10px}
.rel b{font-family:var(--sans);font-weight:500;font-size:14px;color:var(--muted)}
.rel span{min-width:0}
.restart{all:unset;cursor:pointer;display:inline-block;margin-top:36px;margin-right:10px;font-family:var(--sans);font-size:15px;color:var(--paper);background:var(--ink);padding:10px 22px;border-radius:3px}
.restart.alt{background:transparent;color:var(--ink);border:1px solid var(--ink)}
.restart:focus-visible{outline:2px solid var(--carbon);outline-offset:3px}
.note-start{font-family:var(--sans);font-size:14px;color:var(--muted);line-height:1.8}
@media (prefers-reduced-motion:reduce){.choice{transition:none}.seal.stamping,.envelope.flip .arch{animation:none}}
.g{all:unset;cursor:pointer;color:inherit;border-bottom:1px dotted var(--carbon);text-decoration:none}
.g:hover{color:var(--carbon);border-bottom-style:solid}
.g:focus-visible{outline:2px solid var(--carbon);outline-offset:2px}
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:10;padding:0 12px calc(12px + env(safe-area-inset-bottom,0px));pointer-events:none}
.sheet-in{pointer-events:auto;max-width:40rem;margin:0 auto;background:var(--slip);border-top:3px solid var(--carbon);box-shadow:0 -6px 24px rgba(0,0,0,.18);padding:16px 18px 18px;max-height:70vh;overflow-y:auto}
.sheet-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.sheet-in h4{margin:0;font-size:1.05rem;font-weight:700}
.sheet-in p{margin:.6em 0 0;font-family:var(--sans);font-size:14.5px;line-height:1.8}
.x{all:unset;cursor:pointer;font-family:var(--sans);font-size:13px;color:var(--muted);padding:2px 6px}
.x:focus-visible{outline:2px solid var(--carbon)}
.glist{display:flex;flex-wrap:wrap;gap:8px 14px;font-size:15px}
.fade{animation:fin .35s ease-out}
@keyframes fin{from{opacity:.4;transform:translateY(4px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.fade{animation:none}}
/* figures */
figure.art{margin:1.6em 0;padding:0}
figure.art svg{display:block;width:100%;height:auto;max-width:100%}
figure.art figcaption{font-family:var(--sans);font-size:12.5px;line-height:1.7;color:var(--muted);margin-top:8px}
.zoom{all:unset;cursor:zoom-in;display:block;width:100%}
.zoom:focus-visible{outline:2px solid var(--carbon);outline-offset:3px}
#lightbox{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.82);display:flex;flex-direction:column}
#lightbox .lb-bar{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;color:#eee;font-family:var(--sans);font-size:13px}
#lightbox .lb-bar button{all:unset;cursor:pointer;color:#eee;border:1px solid #888;padding:4px 12px;border-radius:3px}
#lightbox .lb-body{flex:1;overflow:auto;padding:12px}
#lightbox .lb-body svg{display:block;width:max(100%,900px);height:auto;margin:0 auto}
@media (min-width:1000px){#lightbox .lb-body svg{width:100%;max-width:1400px}}
/* svg palette */
.f-ink{fill:var(--ink)} .s-ink{stroke:var(--ink)} .f-mut{fill:var(--muted)} .s-mut{stroke:var(--muted)}
.f-red{fill:var(--stamp)} .s-red{stroke:var(--stamp)} .f-blue{fill:var(--carbon)} .s-blue{stroke:var(--carbon)}
.f-slip{fill:var(--slip)} .f-paper{fill:var(--paper)} .s-rule{stroke:var(--rule)} .f-water{fill:var(--water)} .s-water{stroke:var(--water)}
.s-paper{stroke:var(--paper)} .f-land{fill:var(--land)} .f-wall{fill:var(--wall)} .f-fict{fill:var(--fict)}
svg text{font-family:var(--sans)}
svg .brush{font-family:var(--brush)}
svg .serif{font-family:var(--serif)}
svg .mono{font-family:var(--mono)}
/* verdict page for dead ends */
.verdict{position:relative;overflow:hidden;margin-top:24px;background:var(--slip);border:1px solid var(--rule);padding:22px 20px 26px;font-family:var(--mono);font-size:13.5px;line-height:1.9}
.verdict h3{font-family:var(--serif);font-size:1.1rem;letter-spacing:.3em;text-align:center;margin:0 0 14px}
.verdict .vseal{position:absolute;right:16px;bottom:14px;color:var(--stamp);border:3px double currentColor;border-radius:50%;width:86px;height:86px;display:grid;place-items:center;
  font-family:var(--sans);font-size:12px;letter-spacing:.1em;text-align:center;transform:rotate(-14deg);opacity:.8;animation:stampin .6s cubic-bezier(.2,1.6,.4,1)}
.verdict p{margin:.3em 0;padding-right:0}
.verdict .vbody{padding-bottom:70px}
.timeline{display:flex;gap:0;margin:18px 0 0;font-family:var(--mono);font-size:11px;color:var(--muted);border-top:1px solid var(--rule)}
.timeline span{flex:1;padding-top:6px;position:relative;min-width:0;overflow-wrap:anywhere}
.timeline span::before{content:"";position:absolute;top:-4px;left:0;width:7px;height:7px;border-radius:50%;background:var(--rule)}
.timeline span.on{color:var(--carbon)}
.timeline span.on::before{background:var(--carbon)}
</style>
</head>
<body>
<div class="wrap">
  <header class="top"><span id="actname">梦与非梦</span><span class="right"><span id="dreams"></span><button type="button" class="hbtn" id="theme">主题 自动</button></span></header>
  <main id="app" aria-live="polite"></main>
  <div id="sheet" role="dialog" aria-modal="false" aria-label="词条" hidden>
    <div class="sheet-in"><div class="sheet-head"><h4></h4><button type="button" class="x" aria-label="关闭">关闭</button></div><p></p></div>
  </div>
  <div id="lightbox" role="dialog" aria-modal="true" aria-label="放大查看" hidden>
    <div class="lb-bar"><span>可以左右拖动查看</span><button type="button" id="lb-x">关闭</button></div>
    <div class="lb-body"></div>
  </div>
</div>

<script>
(function(){
const S0 = {scene:"title", act:1, facts:[], archive:[], lens:"huang", tab:null, y77:false, seen:[]};
const SAVE_KEY = "mfm-state", DREAM_KEY = "mfm-dreams", THEME_KEY = "mfm-theme";
function fresh(){ return Object.assign({}, S0, {facts:[], archive:[], seen:[]}) }
let st = fresh();
let dreamCount = 0;
try{ dreamCount = parseInt(localStorage.getItem(DREAM_KEY)||"0",10)||0 }catch(e){}
let saved = null;
try{
  const raw = localStorage.getItem(SAVE_KEY);
  if(raw){ const o = JSON.parse(raw); if(o && typeof o==="object" && Array.isArray(o.facts)) saved = o; }
}catch(e){ saved = null }
const hot = window.claude && window.claude.hot && window.claude.hot.data && window.claude.hot.data.st;
if(hot) st = Object.assign(fresh(), hot);

function save(){
  try{ localStorage.setItem(SAVE_KEY, JSON.stringify(st)) }catch(e){}
}
function bumpDream(){
  dreamCount++;
  try{ localStorage.setItem(DREAM_KEY, String(dreamCount)) }catch(e){}
}

const has = f => st.facts.includes(f);
const any = (...fs) => fs.some(has);
const all = (...fs) => fs.every(has);

/* ---------- theme ---------- */
const root = document.documentElement;
let theme = "auto";
try{ theme = localStorage.getItem(THEME_KEY) || "auto" }catch(e){}
function applyTheme(){
  if(theme==="auto") delete root.dataset.theme; else root.dataset.theme = theme;
  document.getElementById("theme").textContent = "主题 " + ({auto:"自动",light:"浅色",dark:"深色"}[theme]);
}
document.getElementById("theme").addEventListener("click",()=>{
  theme = theme==="auto" ? "light" : theme==="light" ? "dark" : "auto";
  try{ localStorage.setItem(THEME_KEY, theme) }catch(e){}
  applyTheme();
});
applyTheme();

/* ---------- glossary ---------- */
const GLOSS = {
  yufeng:{m:["裕丰纱厂"],t:"裕丰纱厂",b:"日本商人在上海杨树浦开办的纱厂。1945年抗战胜利后收归国有，改为中国纺织建设公司第十七棉纺织厂，也就是后来的国棉十七厂，上海最大的几家纺织厂之一。厂里的老工人很多经历过日本工头的时代，“翻身”对他们来说是具体的事，这也是后来他们对厂党委的期待特别高、失望也特别深的原因之一。"},
  cui:{m:["崔根娣"],t:"崔根娣",b:"王洪文的妻子，国棉十七厂工人。文革后她评价王洪文“爱管闲事”。1976年10月，王洪文曾托秘书向她提出离婚以免牵连家人，她表示只要孩子给她就答应，但手续未办完王洪文就被捕了。"},
  nie:{m:["聂元梓"],t:"聂元梓（1921-2019）",b:"北京大学哲学系党总支书记。1966年5月25日与另外六人在北大贴出大字报，点名批判北大党委书记陆平等人。毛泽东下令向全国广播，此举点燃了全国范围的造反。聂后来成为北京红卫兵“五大领袖”之一，1983年被判处有期徒刑十七年。"},
  first:{m:["全国第一张马列主义大字报"],t:"“全国第一张马列主义的大字报”",b:"毛泽东对聂元梓大字报的评语。1966年6月1日晚中央人民广播电台播出这张大字报，次日《人民日报》全文刊登，并配发评论员文章《欢呼北大的一张大字报》。它向全国传递了一个信号，群众可以公开批判本单位的党组织。对工厂里受过气的人来说，这是十七年来第一次听到这样的话从喇叭里说出来。"},
  dzb:{m:["大字报"],t:"大字报",b:"用毛笔写在大张纸上、贴在公共场所的文字，是文革中最主要的群众表达方式。写谁、签不签名、贴在哪里，都可能决定一个人此后的命运。1975年宪法把“大鸣、大放、大辩论、大字报”写进了条文，1980年又删去。"},
  sanjia:{m:["三家村"],t:"三家村",b:"邓拓、吴晗、廖沫沙三人1961年起在北京市委刊物《前线》上合写杂文专栏“三家村札记”。1966年5月被定为“反党反社会主义”的黑店，遭全国批判。文革初期很多单位的大字报先批这类远处的目标，本单位的领导则不敢碰。"},
  gzd:{m:["工作队"],t:"工作队",b:"1966年6月，在毛泽东离京期间主持中央一线工作的刘少奇、邓小平决定向学校和工厂派驻工作队，领导运动。工作队普遍把矛头引向“牛鬼蛇神”和给党委提意见的群众。7月底毛泽东回京后批评工作队“压制群众”，下令撤出学校，此后“反工作队”成为造反派的正当性来源。国棉十七厂先后来过两支，6月20日纺织局派来的一支曾肯定王洪文的大字报，7月20日市委派来的一支则不再重用他。"},
  nggs:{m:["牛鬼蛇神"],t:"牛鬼蛇神",b:"文革中对各种“阶级敌人”的泛称，范围可以无限扩大，地主、富农、反革命、坏分子、右派，以及有“历史问题”的人都可以算进去。把运动的重点放在“横扫牛鬼蛇神”，往往意味着挨整的是普通群众，当权者反倒安然无恙。"},
  dangan:{m:["档案袋"],t:"档案与黑材料",b:"中国城市单位中每人都有一份人事档案，由组织保管，本人不能查看，随人调动，决定入党、提干、分房等一切事务。文革初期工作队和党委收集群众的言行整理成材料装进档案，后来被称作“黑材料”。要求销毁黑材料，是1966年秋冬造反派最迫切的诉求之一。十年以后清查“三种人”，用的也是同一种纸袋。"},
  shiliu:{m:["《十六条》"],t:"《十六条》",b:"1966年8月8日八届十一中全会通过的《中共中央关于无产阶级文化大革命的决定》，共十六条。它规定运动的重点是“整党内那些走资本主义道路的当权派”，并警告不准把群众打成反革命。造反派普遍把它当作护身符。"},
  liao:{m:["廖祖康"],t:"廖祖康",b:"1948年生，国棉十七厂职业学校学生。文革初期带红卫兵为王洪文解围，此后一直追随他，后来成为王洪文在北京的生活秘书。他的回忆是关于王洪文私生活的重要来源，但网上流传的版本大多经过改写。"},
  hongqi:{m:["《红旗》杂志"],t:"《红旗》杂志",b:"中共中央理论刊物，文革中由陈伯达等人主持，与《人民日报》《解放军报》合称“两报一刊”，其社论往往代表最高层的最新意图。"},
  fdlx:{m:["资产阶级反动路线"],t:"资产阶级反动路线",b:"1966年10月《红旗》社论和中央工作会议正式提出的说法，指文革初期派工作队、打击群众的做法。一旦被定为“反动路线”，此前被整的群众就可以要求平反，此前整人的干部则要检讨。这个转向让大批基层造反派从“被整的人”变成了“正确的人”。"},
  hwb:{m:["红卫兵"],t:"红卫兵",b:"1966年起以大中学生为主的群众组织。8月起毛泽东在天安门多次接见红卫兵，全国“大串联”开始，学生免费乘车四处串联。北京学生到上海串联，是上海工人造反派早期的重要推动力。"},
  wxz:{m:["王秀珍"],t:"王秀珍（1934-2008）",b:"国棉三十厂工人，劳动模范，工总司早期骨干，后任上海市委书记，是文革中职位最高的上海女工之一。1982年8月21日被上海市高级人民法院判处有期徒刑十七年，1994年刑满释放。出生年份另有1935年一说。"},
  hjh:{m:["黄金海"],t:"黄金海（1935-2015）",b:"国棉三十一厂工人，1965年被评为上海市五好工人。文革初期因大字报被打成反党分子，愤而造反，是工总司的筹建者之一，后任上海市革委会常委。1976年后以“反革命罪”被判刑十五年，1991年出狱，晚年写成回忆录《十年非梦》。书名是对徐景贤《十年一梦》的回应。"},
  wuhao:{m:["五好工人"],t:"五好工人",b:"六十年代工厂里评比的荣誉称号，要求政治思想、完成任务、遵守纪律、团结互助、学习好。能当选的通常是车间里公认的积极分子。"},
  fandang:{m:["反党反社会主义分子"],t:"反党反社会主义分子",b:"一种政治定性。一旦被扣上，不仅本人在单位里抬不起头，档案里也会留下记录，家属同样受到影响。文革初期很多只是给基层党组织提意见的人都被这样定性。"},
  maoxuan:{m:["学毛选"],t:"学毛选",b:"学习《毛泽东选集》。六十年代全国推广“学毛著”运动，工厂车间普遍组织学习小组。批评党组织学毛选不认真，本来是站在最正确的立场上提意见，却照样可以被打成反党。"},
  pan:{m:["潘国平"],t:"潘国平（1946-2013）",b:"上海玻璃机械厂青年工人，工总司早期最活跃的领导人之一，人称“潘司令”，一度名气在王洪文之上。安亭谈判时他是和张春桥对话的主角。此后逐渐被边缘化，多次受到审查。他没有党员身份，也没有干部履历，这在工总司被吸纳进体制的过程中成了致命的短处。"},
  gzs:{m:["上海工人革命造反总司令部","工总司"],t:"工总司",b:"上海工人革命造反总司令部，1966年11月成立，王洪文为主要负责人。它是全国第一个被中央文革小组明确支持的跨行业、全市性工人造反组织。1967年后逐步体制化，骨干进入各级革委会，在上海政坛活跃了整整十年。1976年后，它的成员在清查中被逐个审查，很多人一辈子背着这个身份。"},
  cao:{m:["曹荻秋"],t:"曹荻秋（1909-1976）",b:"时任上海市长、市委书记处书记，市委第一书记陈丕显病休期间主持日常工作。对工总司采取“不参加、不承认、不支持”的方针。12月23日他又签字承认了赤卫队，两天后在造反派大会上宣布签字作废。1967年一月风暴后被打倒，1976年去世。两个多月里他对两派都签过字，又都收回过，这是上海市委在那个冬天的处境。"},
  sanbu:{m:["不参加，不承认，不支持"],t:"“三不”方针",b:"上海市委对工总司的态度。当时中央的规定是工人不得跨厂串联、不得成立跨行业组织，市委以此为依据。在造反派看来，这等于宣布他们非法。"},
  nzzz:{m:["北站"],t:"上海北站",b:"当时上海的铁路总站，沪宁线的起点。11月10日凌晨，工总司的工人从这里挤上北去的列车。"},
  anting:{m:["安亭"],t:"安亭",b:"上海嘉定县的一个小镇，沪宁铁路上的一个小站，离上海三十多公里，这一段是单线。1966年11月10日上午8时17分，北上工人乘坐的602次慢车奉命停在这里的岔道上，旁边是一个装卸煤的煤场。此后有人在路边挥帽子、挥衣服拦下过往列车，史称“安亭事件”。拦了哪几趟车、拦了多久，至今有好几种说法。一个半月后，赤卫队北上告状，被拦在下一站附近的昆山。"},
  hn:{m:["沪宁线"],t:"沪宁铁路",b:"上海到南京的铁路，当时是全国最繁忙的干线之一，连接京沪线。安亭事件中它中断了多久有三种说法：上海铁路分局调度所1979年的材料说31小时34分，叶永烈说20小时21分，黄金海说被拦的648次只停了二十几分钟。那份调度材料写于清查期间，调度所的负责人王玉玺恰是赤卫队的头头，这也是黄金海不信它的理由。"},
  cwd:{m:["赤卫队"],t:"赤卫队",b:"保守派工人组织，全称“捍卫毛泽东思想工人赤卫队上海总部”。据黄金海回忆，11月19日曹荻秋接见工人保守派代表，23日在杨浦区委会议室筹备，市委组织部长杨士法支持并给了办公室，12月6日在人民广场开成立大会（维基作11月26日成立）。号称最多八十万人。发起人大多是工总司各发起单位里的对立派头头，十七棉的是马骥，铁路分局调度所的是王玉玺。成员多是党团员、劳模和车间积极分子，他们真心认为自己在保卫党和生产，也是建国以来的受益者，相信跟着党委不会吃亏。12月30日在康平路被冲散，此后在全市被取缔，许多成员被抓、被斗。"},
  cbd:{m:["陈伯达"],t:"陈伯达（1904-1989）",b:"毛泽东的长期秘书，中央文革小组组长，《红旗》杂志总编辑。安亭事件时亲笔起草电报劝工人回上海，说“有问题就地解决”。这份电报后来被毛泽东、江青、张春桥否定。1970年庐山会议后倒台。"},
  zcq:{m:["张春桥"],t:"张春桥（1917-2005）",b:"上海市委书记处书记、中央文革小组副组长。安亭事件中他未经华东局和上海市委同意，签字承认工总司合法，由此在上海建立起自己的群众基础，王洪文也由此进入他的视野。毛泽东事后认可他“先斩后奏”。1967年起任上海市革委会主任。后为“四人帮”成员，1981年被判处死刑缓期执行，在法庭上始终不发一言。"},
  zyw:{m:["中央文革小组"],t:"中央文革小组",b:"1966年5月成立，名义上隶属政治局常委会，实际上成为文革的指挥中枢。组长陈伯达，顾问康生，第一副组长江青，副组长张春桥等。它对哪个群众组织表态支持，几乎决定该组织的命运。"},
  hdj:{m:["华东局"],t:"华东局",b:"中共中央华东局，中央派驻华东地区的领导机构，地位在上海市委之上。安亭事件中它与上海市委都主张不承认工总司。"},
  wuxiang:{m:["五项要求"],t:"五项要求",b:"11月13日下午张春桥在文化广场后台化妆间签字同意的工总司要求，由潘国平和几个红卫兵当场议定。据黄金海所录，一，承认上海工人革命造反总司令部是合法组织。二，承认十一月九日大会及被迫赴北京控告是革命行动（以后碰到类似情况选少数代表）。三，这次所造成的后果由华东局、上海市委负全部责任。四，曹荻秋必须向群众作公开检查。五，对上海工人革命造反总司令部工作提供各方面的方便。括号里那句据说是张春桥亲笔加的。一个钟头前，他刚在康平路同意了陶铸代表中央表达的不承认工总司的意见。两天后在苏州，他和韩哲一、曹荻秋又对耿金章那一拨人签了另一份五项要求。"},
  qincheng:{m:["秦城"],t:"秦城监狱",b:"位于北京昌平，关押高级别政治犯的监狱。王洪文1976年被捕后在此关押，1981年被判处无期徒刑，1986年后因病转院治疗，1992年8月3日病逝。"},
  baopao:{m:["包炮"],t:"包炮",b:"上海红卫兵“红三司”的学生领袖，安亭谈判时在场，不时帮两方说话，据谢鹏飞回忆曾当面顶撞张春桥。后来成为雕塑家，改名包泡。RFA有他的访谈。"},
  xiepf:{m:["谢鹏飞"],t:"谢鹏飞",b:"工总司早期骨干之一，参加了安亭谈判，他的回忆是谈判经过的主要来源之一。"},
  geng:{m:["耿金章"],t:"耿金章",b:"原名耿玉章，山东人。当过国民党军上等兵，济南战役中被俘，随即参加解放军，升到副排长，1949年入党，1957年复员到上海，在造纸厂当打浆工，1964年提为副工长。安亭事件后，不肯回来的五百来人在昆山中学推他带队，理由是他是党员；他组织的“尖刀班”打了来劝返的王洪文。苏州回来时他坚持留通讯录，随后以这四百多人为底子拉出“北上返沪二兵团”，号称五六十万人，名义上归工总司，实际上不听王洪文指挥。黄金海认为张春桥有意扶植二兵团来牵制工总司。1967年2月公社成立后他另组“大联合委员会”与公社对抗，随即被王洪文设局抓起来，二兵团瓦解。1973年张春桥说他犯的是王明、陈独秀那样的“分裂主义”错误。"},
  xianfa:{m:["第八十七条"],t:"1954年宪法第八十七条",b:"条文是“中华人民共和国公民有言论、出版、集会、结社、游行、示威的自由。国家供给必需的物质上的便利，以保证公民享受这些自由。”安亭事件后，毛泽东在钓鱼台召开的常委扩大会上拿出宪法，念“结社自由”一段，针对陶铸和陈丕显问：“工人有没有结社自由？宪法你们看不看？”又说：“上海问题，张春桥是对的。先有事实，后有政策。”（王锐转引王力回忆，会议日期王锐作11月16日）。这是文革中极少数“宪法条文被最高层当众引用来保护群众组织”的时刻。同样的条文，一个多月后并没有被拿来保护赤卫队。"},
  hzy:{m:["韩哲一"],t:"韩哲一",b:"中共中央华东局书记处书记。安亭事件时他到安亭车站，对工人受的委屈表示道歉，答应派特快送大家去北京，应要求在本子上写下“祝大家北上成功”，随后陈伯达的电报到来，此事不了了之。15日在苏州，他和张春桥、曹荻秋一起在耿金章那一拨人的五项要求上签了字。一月风暴里他被造反派抓去要经费，黄金海把他和魏文伯安顿在和平饭店。"},
  wyx:{m:["王玉玺"],t:"王玉玺",b:"上海铁路分局调度所负责人，赤卫队总部的主要头头之一。据黄金海回忆，康平路事件时他把调度所的人全调到康平路，铁路一度失去调度，随后又私调列车把大批赤卫队员送往北京，周恩来下令逮捕了他。那份说安亭事件使沪宁线中断31小时34分的调度材料，出自他所在的调度所。"},
  zhangqi:{m:["张祺"],t:"张祺",b:"上海市委常委、市总工会主席。11月10日凌晨两点多，他代替曹荻秋出来见工总司的人，说“这个组织嘛，是十六条上没有的”，拒绝承认。这句话之后，队伍涌向了北站。后来曹荻秋签了赤卫队的八项要求，陈丕显把赤卫队的事推给了他和杨士法。"},
  lianguo:{m:["面包收条"],t:"面包收条",b:"叶永烈说他在写《王洪文传》时找到过一张1966年11月10日安亭的面包收条签名单。市委和铁路局一边扣车，一边给车上的人送吃的。这类单据后来成了清查时认定“谁去过安亭”的证据之一。"},
};
let GLIST = [];
function rebuildGlist(){ GLIST = Object.entries(GLOSS).flatMap(([k,v])=>v.m.map(x=>[x,k])).sort((a,b)=>b[0].length-a[0].length) }
rebuildGlist();
function glossPart(html, used, slots){
  for(const [term,key] of GLIST){
    if(used.has(key)) continue;
    let from = 0, idx = -1;
    while(true){
      idx = html.indexOf(term, from);
      if(idx<0) break;
      const before = html.slice(0,idx);
      if(before.lastIndexOf("<")>before.lastIndexOf(">")){ from = idx+term.length; continue }
      break;
    }
    if(idx<0) continue;
    used.add(key);
    slots.push(`<button type="button" class="g" data-g="${key}">${term}</button>`);
    html = html.slice(0,idx) + "\u0000"+(slots.length-1)+"\u0000" + html.slice(idx+term.length);
  }
  return html;
}
function gloss(html){
  const slots=[]; const used=new Set();
  const parts = html.split(/(<figure[\s\S]*?<\/figure>)/);
  const out = parts.map(p => p.startsWith("<figure") ? p : glossPart(p, used, slots)).join("");
  used.forEach(k=>{ if(!st.seen.includes(k)) st.seen.push(k) });
  return out.replace(/\u0000(\d+)\u0000/g,(_,i)=>slots[+i]);
}
const sheet = document.getElementById("sheet");
function openGloss(key){
  const g = GLOSS[key]; if(!g) return;
  sheet.querySelector("h4").textContent = g.t;
  sheet.querySelector("p").textContent = g.b;
  sheet.hidden = false;
  sheet.querySelector(".x").focus();
}
const lightbox = document.getElementById("lightbox");
function openZoom(fig){
  const svg = fig.querySelector("svg"); if(!svg) return;
  const body = lightbox.querySelector(".lb-body");
  body.innerHTML = ""; body.appendChild(svg.cloneNode(true));
  lightbox.hidden = false; document.getElementById("lb-x").focus();
}
document.addEventListener("click",e=>{
  const b = e.target.closest(".g"); if(b){ openGloss(b.dataset.g); return }
  if(e.target.closest("#sheet .x")) sheet.hidden = true;
  const z = e.target.closest(".zoom"); if(z){ openZoom(z.closest("figure")); return }
  if(e.target.closest("#lb-x") || e.target===lightbox) lightbox.hidden = true;
});
document.addEventListener("keydown",e=>{ if(e.key==="Escape"){ sheet.hidden=true; lightbox.hidden=true } });

/* ---------- figures (all drawn in SVG; no external images) ---------- */
const TAGS = {photo:`<span class="tag photo">历史照片</span>`, recon:`<span class="tag recon">依据史料的复原</span>`, illus:`<span class="tag illus">游戏插画</span>`};
function fig(kind, svg, cap, label){
  return `<figure class="art"><button type="button" class="zoom" aria-label="放大查看：${label}">${svg}</button><figcaption>${TAGS[kind]}${cap}</figcaption></figure>`;
}
function scribble(x,y,w,seed){
  // a row of ink blocks that reads as handwriting from a distance
  let d = "", cx = x, s = seed;
  while(cx < x+w-8){ s = (s*9301+49297)%233280; const len = 9 + (s%13); d += `M${cx} ${y}h${Math.min(len, x+w-cx)}`; cx += len + 5 + (s%4); }
  return d;
}
const FIG = {};
FIG.dazibao = () => {

  // seven signatures as vertical columns, rightmost is Wang Hongwen

<p>保卫科的同事告诉你一件事，他是压低了声音说的。工作队在整材料。谁贴了什么大字报，谁在会上说了什么话，谁跟谁走得近，一条一条都记下来，装进档案袋。</p>
<p>你在保卫科干了六年，你比谁都清楚档案袋意味着什么。那几页纸会跟着一个人走一辈子，调动、入党、提干、分房子，每一次都要被翻出来看。而本人永远看不到上面写了什么。</p>
<p>八月，报上登出了《十六条》。你在食堂里读完，拍着桌子说：“好像中央在直接指我们厂的形势。”《十六条》里写着，运动的重点是整党内走资本主义道路的当权派，要警惕有人把群众打成反革命。</p>
<p>可是在厂里，什么都没变。工作队组织了四次全厂大辩论，辩论的中心就是你们。十月十日那一次，你被一群人围在中间，推推搡搡，有人往你脸上吐唾沫。你记住了那张脸，是细纱车间的一个保全工，平时见了你还递烟。</p>
<p>后来是厂里职业学校的一群学生冲进来，把你拉了出去。带头的那个孩子才十八岁，叫廖祖康。</p>`,

  src:`<p><span class="tag hist">史实</span> 7月20日市委派约一百五十人的工作队进驻，队长为市总工会副主席施惠珍，局工作队随即撤回；市委工作队不重用王洪文。见RFA《纵横大历史》工总司成立系列（搜索摘要）。工作队撤出的具体日期仍未查到，只知十月王洪文从北京回来后被冲垮。</p>

  kpl:{m:["康平路"],t:"康平路事件",b:"康平路是上海市委书记处所在地。1966年12月28日，近两万赤卫队员进入大院请愿，要市委对签字作废给说法。29日张春桥在北京通过妻子李文静、徐景贤传话，要造反派“不要让赤卫队把胜利的果实夺走了”，耿金章从北京赶回设指挥部。30日凌晨2时起工总司等组织冲击大院，到6时三百多名赤卫队员被抓，91人重伤送医，7时两万人排成单行分六路走出，缴下的袖章堆成六大堆。它通常被看作上海大规模武斗的开端。张春桥事后说：“这一仗一打，市委瘫痪了，垮了。”对赤卫队员来说，这一夜之后他们在单位里的身份就变了。"},
  tjtl:{m:["《特急通令》","特急通令"],t:"《特急通令》",b:"1966年12月31日工总司印发的命令，要求“把工人赤卫队上海总部及各区、分部的头子统统抓起来，押送公安局”。一个群众组织给另一个群众组织下逮捕令，公安局照单收人，这在1967年初的上海是常态。后来王维国等人发现公安系统关押了大批赤卫队员，理由只是“反对王洪文”“反对工总司”。第一轮核查把它记作“紧急命令”，名称以此为准，全文待查。"},
  kunshan:{m:["昆山"],t:"昆山事件",b:"康平路之后，约一万名赤卫队员12月30日下午步行北上，要去北京告状，31日下午到江苏昆山，追来的造反派也到了，冲突中沪宁线部分列车受阻。1967年1月3日市委书记马天水赶到昆山劝返，最后仍有六七千人去了北京。昆山在安亭的下一站。一个半月前被拦的是造反派，这一次被拦的是保守派，两次北上告状的理由几乎一样，都是地方不承认，去找中央。"},
  yyfb:{m:["一月风暴","一月革命"],t:"一月风暴",b:"1967年1月上海造反派夺取市委、市政府权力的过程，官方当时称“一月革命”。1月4日、5日接管《文汇报》《解放日报》，6日开大会打倒市委，此后市委市府停止运转；9日发表《紧急通告》，11日中央四家联名贺电。毛泽东说“上海革命力量起来，全国都有希望”，全国随即掀起夺权。它被当作样板推广，可上海的夺权本身是在中央文革一手指导下完成的，所谓群众自下而上夺权，从一开始就有上面的手。"},
  jjtg:{m:["《紧急通告》"],t:"《紧急通告》",b:"1967年1月9日刊登在《文汇报》《解放日报》上，工总司等造反组织署名（一说32个组织，一说11个，待查），共十条。它把一月初工人要求补发工资、临时工转正、下放人员回城等要求称为“经济主义”，说是市委走资派从经济上发动的“新反扑”，要求“抓革命，促生产”。中央在贺电中说它“完全正确”。讽刺的是，工总司正是靠被整、被压的普通工人起家的，这份通告却要这些人把自己的诉求收回去。"},
  jjzy:{m:["经济主义"],t:"经济主义",b:"原指工人运动只争经济利益、不问政治。1967年1月上海用它指称工人要钱、要转正、要回城的风潮。有些单位领导为了自保开闸放钱，银行出现挤兑，这是真的；可大多数要求本身是积压多年的真实委屈，临时工干了十年还不能转正，下放的人回不了家，这也是真的。一顶帽子把两件事扣在了一起。"},
  lsg:{m:["临时工","合同工"],t:"临时工与合同工",b:"六十年代推行“亦工亦农”和临时工、合同工制度，这些人干同样的活，没有固定工的工资级别、劳保和档案，说辞就辞。他们是文革初期最早也最坚决的造反者之一，因为他们几乎没有什么可失去的。1967年初他们要求转正，被《紧急通告》定为经济主义，中央随后下文取缔了全国性的临时工组织。"},
  shgs:{m:["上海人民公社"],t:"上海人民公社",b:"1967年2月5日在人民广场宣告成立，宣言题为《一月革命胜利万岁！》，张春桥任主任，姚文元、王洪文等任副主任。筹备始于1月19日，王洪文受命召集造反组织头头开会，按巴黎公社原则建立新政权，初名“新上海公社”。宣言本身写明，领导成员要等“全面大夺权取得胜利后，由革命群众按照巴黎公社原则选举产生”，“在目前”则由各造反组织“协商推举”组成临时委员会，而且临时委员会已经是群众组织、驻沪部队负责人和革命领导干部的“三结合”。宣言里还写了“谁要脱离群众……就必须随时撤换清洗”。它从头到尾没有进行过任何选举。成立不到三周，毛泽东问，各省都叫公社，国务院叫什么，国号叫什么，“还是叫革命委员会”。它存在的十九天，是文革中离“巴黎公社”这几个字最近的时刻，也最清楚地说明了这几个字在当时只是一面旗子。"},
  bjgs:{m:["巴黎公社"],t:"巴黎公社原则",b:"1871年巴黎公社的做法，由马克思在《法兰西内战》中总结，公职人员由普选产生、可以随时罢免，工资不高于熟练工人。《十六条》写明文化革命委员会要“实行像巴黎公社那样的全面的选举制”。李逊的研究指出，这些原则在文革中被用来动员群众冲击旧体制，一到新政权要建立时就被放弃了。王洪文后来当到中共中央副主席，仍然每月领64元，这大概是这些原则留下的唯一痕迹。"},
  gwh:{m:["革命委员会","革委会"],t:"革命委员会",b:"文革中夺权后建立的地方权力机构，由军队代表、“革命领导干部”和群众组织代表“三结合”组成。1967年2月24日上海人民公社改名上海市革命委员会，此后全国各省陆续成立。上海改名的时候，屋里的人一个没换，因为公社的临时委员会本来就是三结合。真正被拿掉的是公社宣言里那句承诺，等全面夺权胜利后按巴黎公社原则选举。1978年以后逐步撤销。"},
  sanjh:{m:["三结合"],t:"三结合",b:"革命委员会的组成原则，军队、干部、群众组织三方各出代表。在上海，它早在1967年2月5日的公社宣言里就写进去了，临时委员会由“革命群众组织，人民解放军驻沪部队负责人和坚持毛主席革命路线的革命领导干部三结合”组成，比改名早了近三周。它是一月夺权后收拾局面的办法，既把造反派头头吸收进来，又用军队和老干部压住他们。马天水就是干部这一头的代表。"},
  cpx:{m:["陈丕显"],t:"陈丕显（1916-1995）",b:"1965年11月起任上海市委第一书记，1966年4月到12月因鼻咽癌病休，由曹荻秋主持工作。12月24日病中主持书记处会议，认为曹荻秋签字承认赤卫队是错误的。1967年1月6日在人民广场被批斗，此后被关押审查多年。文革后复出，任湖北省委第一书记、中央书记处书记。回忆录《在“一月风暴”的中心》。据王维国遗稿，王维国曾放出专案组关押的陈丕显，惹怒张春桥和王洪文。"},
  mts:{m:["马天水"],t:"马天水（1912-1988）",b:"上海市委书记处书记，长期主管工业。1月6日与陈丕显、曹荻秋一起挨斗，随后在张春桥说服下“站过来”，成为革委会里干部一方的代表，此后十年主管上海工业生产。1976年10月后曾参与上海方面的应对，被隔离审查，精神失常，死于精神病院。他代表了另一种人，一个懂生产的老干部，靠转向保住了位置，最后被这次转向吞掉。"},
  xjx:{m:["徐景贤"],t:"徐景贤（1933-2007）",b:"上海市委写作班党支部书记，人称“徐老三”。1966年12月18日带写作班造市委的反，喊出“火烧陈丕显！揪出曹荻秋！打倒杨西光！砸烂常溪萍！”。张春桥、姚文元在上海的传声筒，康平路前夜的电话就是经他转达的。1967年1月27日被复旦红卫兵绑走，引发“炮打张春桥”。后任上海市委书记。1976年后被判刑十八年，晚年写成回忆录《十年一梦》，书里对王洪文多有负面描写。黄金海的回忆录叫《十年非梦》，是对这本书的回答。"},
  ebt:{m:["二兵团"],t:"二兵团",b:"耿金章领导的“工总司第二兵团”，名义上是工总司下属，实际自成一系，1967年初号称五六十万人，一度比工总司本部还大。它的班底据说是安亭后不肯回来、跟着耿金章走到苏州的那批人。1967年2月耿金章被王洪文设局抓起来，二兵团随即瓦解。"},
  rmgc:{m:["人民广场"],t:"人民广场",b:"上海市中心的大广场，原为跑马厅。文革中几乎所有的全市性大会都在这里开，12月23日赤卫队大会、1月6日打倒市委大会、2月5日上海人民公社成立大会都在这里。"},
  wenhui:{m:["《文汇报》"],t:"《文汇报》",b:"上海的另一份大报。1965年11月它刊登姚文元《评新编历史剧〈海瑞罢官〉》，文革由此发端。1967年1月4日被造反派接管，是一月风暴的第一步。"},
});

FIG.piles = () => {
  const pile = (cx, n, seed) => { let s = seed, out = "";
    for(let i=0;i<n;i++){ s=(s*9301+49297)%233280; const x = cx + (s%40) - 20, y = 158 - i*2.6 - (s%7), r = (s%50)-25;
      out += `<rect x="${x-16}" y="${y}" width="32" height="10" rx="2" transform="rotate(${r} ${x} ${y})" fill="${i%3?"#a8321f":"#8e2618"}" stroke="#00000044" stroke-width=".8"/>`; }
    return out; };
  const svg = `<svg viewBox="0 0 640 220" role="img" aria-label="六堆被缴下的袖章">
  <rect width="640" height="220" class="f-land"/>
  <path d="M0 176H640" class="s-mut" stroke-width="1"/>
  ${[60,165,270,375,480,585].map((x,i)=>pile(x, 34+i*3, i*71+9)).join("")}
  ${[60,165,270,375,480,585].map((x,i)=>`<text x="${x}" y="200" font-size="12" class="f-mut" text-anchor="middle">第${"一二三四五六"[i]}路</text>`).join("")}
</svg>`;
  return fig("recon", svg, `六堆袖章。“两万多人排成单行，分成六路……缴下的袖章有六大堆”，见维基〈康平路事件〉、国史网〈上海“一月革命”的前前后后〉（搜索摘要）。堆的大小与形状是示意。点击可放大。`, "六堆袖章");
};

      has("lead_pan") ? `<p>潘国平坐在里屋正中那张桌子后面，进门的人先找潘司令。你坐在他左手边，管组织，管登记，管那枚刚刻好的公章。有人来办事，事情办完了，走的时候会回头冲你点一下头。</p>` :
      `<p>墙上贴着一张轮值表，七家厂的名字排成一列，这个礼拜轮到国棉三十一厂。黄金海坐在正中那张桌子后面，不太习惯，隔一会儿站起来走一圈。进门的人问谁是司令，他说没有司令，那人愣了一下，把名单放在桌上走了。</p>`;
    const dis = any("dissent","swallowed") ? `<p>登记处有个人把你的名字念出来，旁边有人接了一句，站台上那个。没人笑，也没人再说什么。</p>` :
      has("go_back") ? `<p>也有人在背后说，他是半路回来的。</p>` : ``;
    const geng = has("hard") ? `<p>耿金章从苏州回来以后没进这几间房子。他在闸北另外挂了一块牌子，手下的人叫他耿司令。他托人给你捎过一句话，说老王，有空过来喝酒。</p>` :
      `<p>从苏州回来的那几百人，没几天就在闸北另外挂了一块牌子，领头的是上海纸浆厂的耿金章。有人说他当过国民党的兵，有人说他是个副排长，入过党。他的人管他叫耿司令。</p>`;
    return `
<p>五项要求签下来以后，工总司在巨鹿路有了总部，过些日子又搬到复兴中路1350弄。门口天天排队，都是来登记的。有的是一个厂来一个代表，揣着一叠名单；有的是一个人来，说他们车间就他一个。登记用的桌子是从一家小学借来的，桌面上还刻着别的孩子的名字。</p>
${role}${dis}${geng}
${any("ks_leave","ks_stay")?`<p>耿金章的二兵团也挂出了牌子。在昆山中学打过你的那几个人，现在都戴着二兵团的袖章，见了你，有一个还点了点头。</p>`:``}<p>十一月底，另一块牌子也挂了出来，捍卫毛泽东思想工人赤卫队上海总部。市委组织部给了他们总工会的一间办公室，十二月六日他们在人民广场开成立大会，曹荻秋到了场。一个月前你们在文化广场等他，他没来。他们说自己才是保卫毛主席的，工总司是一帮擅离岗位、拦火车的人。他们的人比你们多，很多是党员、团员、劳模，车间里的积极分子。有人说他们有八十万。</p>
${FIG.armbands()}
<p>国棉十七厂也成立了赤卫队，领头的是马骥，你们厂里跟你对着干了半年的那个人。成立那天，你在厂门口看见细纱车间那个保全工，钱师傅，十月十日往你脸上吐唾沫的那一个。他戴着新袖章，站在队伍第一排，眼睛看着前面，没有看你。</p>
<p>回家的路上，崔根娣问你，钱师傅的老婆跟她一个车间，她以后还跟不跟人家说话。</p>`;
  },
  choices:[
    {t:"你说，该说话就说话。说完你自己也不知道这句话对不对。", set:null, a66:null, a77:null, next:"b1"}
  ],
  src:`<p><span class="tag hist">史实</span> 工总司总部先在巨鹿路，后迁复兴中路1350弄、杭州路小学、南京西路政协，1967年1月中旬迁至外滩市总工会大楼。赤卫队11月19日由曹荻秋接见保守派代表发端，23日在杨浦区委筹备，12月6日在人民广场开成立大会，曹荻秋等出席；十七棉的发起人是马骥。见黄金海《十年非梦》第四、五章。</p>
<p><span class="tag hist">史实</span> 赤卫队全称“捍卫毛泽东思想工人赤卫队上海总部”，1966年11月26日成立，号称最多八十万人。见维基〈《解放日报》事件〉（搜索摘要）。耿金章生平见凤凰网〈王洪文“死对头”耿金章的回忆〉等（搜索摘要）。</p>
<p><span class="tag disp">有争议</span> 耿金章“二兵团”的班底是否来自安亭后去苏州的人，只见于一处说法，待原文。</p>
<p><span class="tag fict">虚构</span> 工总司新址的样子、钱师傅、崔根娣的问话为游戏演绎。</p>`
};

SC.b1 = {
  act:2, tl:0, tone:"2",
  stamp:"1966年11月30日至12月9日", place:"汉口路274号 · 解放日报社",
  title:"报社",
  text:()=>`
<p>起因是一张小报。红卫兵的红革会办了一张《红卫战报》，要夹在《解放日报》里一起发出去。报社不肯。十一月三十日凌晨一点，红革会从各个学校调来学生，冲进汉口路274号，占了楼下几层。</p>
${FIG.paper()}
<p>红革会事先没跟工总司打招呼。十二月一日，赤卫队调了上万人把报社围了起来，喊我们要看《解放日报》，《解放日报》是党报。楼里只有几十个红卫兵，把门窗堵死了，有人被打伤，有人晕过去。</p><p>二日，红革会的人跑到工总司来求援。总部里好几个人不高兴，说这么大的事，事先连个招呼也不打。${has("lead_pan")?"潘国平看着你。":"大家看着你。"}你想了一会儿说，他们大方向是对的，红卫兵一直帮着我们，这个忙要帮。三日，工总司从黄浦、长宁两个区调了三千多人过去。</p>
<p>你带人赶到的时候，汉口路已经堵死了。楼里是红卫兵和工总司的人，楼外是赤卫队，一层一层围着，再外面是看热闹的。两边都是工人。有人隔着人墙对骂，骂的是同一个厂里才知道的外号。</p>
<p>报社的印刷工被堵在车间里出不来。一个老排字工坐在铅字架子旁边，手里捏着一个铅字，一直没放下。他说他排了十七年《解放日报》，一天也没停过。</p>
<p>到了第三天，楼外有人开始往楼里扔东西，楼里有人往下泼水。十二月的水，泼下去就结成冰。有个赤卫队的老工人踩在冰上摔了一跤，爬起来，没有骂人，拍了拍棉裤上的冰碴子，站回原来的地方。</p>
${FIG.shmap(["paper","people","square","kangping"])}`,
  choices:[
    {t:"进楼，跟红卫兵站在一起。", set:"in_paper",
     a66:"11月30日　支援红革会革命行动，进驻解放日报社。",
     a77:"11月30日　率工总司人员冲击、封闭解放日报社。", next:"b2"},
    {t:"站在门口，叫自己的人手挽手，把两边工人隔开。", set:"buffer",
     a66:"12月　在解放日报社门前维持秩序，防止工人群众之间发生冲突。",
     a77:"12月　参与围困解放日报社。", next:"b2"},
    {t:"穿过人墙，走到赤卫队那一边去，找他们领头的说话。", set:"talk_cwd",
     a66:"12月　在解放日报社现场与赤卫队群众对话。",
     a77:"12月　参与围困解放日报社。", next:"b2"}
  ],
  src:`<p><span class="tag disp">有争议</span> 工总司何时介入。维基说11月30日红革会冲进报社时就有五千多工总司队员；黄金海说红革会事先没和工总司商量，12月1日赤卫队调上万人包围报社，2日红革会来求援，王洪文“虽对‘红革会’贸然行动不满，但感到他们大方向还是对的”，3日才调人进报社，5日王一平、宋季文签了红革会的三项决定和工总司的四项要求，8日工总司撤出，有人骂王洪文“右倾逃跑”。黄金海还说双方并没有发生肢体冲突。见《十年非梦》第五章。</p>
<p><span class="tag hist">史实</span> 红革会要求《红卫战报》随《解放日报》一起发行被拒；11月30日凌晨1时左右冲进汉口路274号报社。一说三百多红卫兵和五千多工总司队员进入报社。对峙八天九夜，经中央文革小组指示签订《三项决议》与《四项要求》，12月7日复刊，9日陆续撤出。工总司站在红革会一边，赤卫队站在报社一边，这是两派工人第一次大规模对峙。见维基〈《解放日报》事件〉、新浪〈红卫兵当年为何持续九天九夜围攻解放日报社〉、RFA“打解放日报”一讲（均为搜索摘要）。</p>
<p><span class="tag fict">虚构</span> 老排字工、泼水结冰、摔跤的老工人为游戏演绎。第三个选项是两派和解这条梦的一颗种子。</p>`

SC.b2 = {
  act:2, tl:1, tone:"2",
  stamp:"1966年12月23日至25日", place:"人民广场 · 文化广场",
  title:"八项要求",
  text:()=>{
    const pre = has("in_paper") ? `<p>报社那八天九夜，你在楼里睡了六个晚上，醒来的时候半边脸是麻的。十二月七日报纸复刊，九日你们撤出来，楼下的赤卫队员冲你们吐口水。有一口吐在你鞋面上，你低头看了一眼，想起十月十日。</p>` :
      has("buffer") ? `<p>报社那八天九夜，你带人手挽着手站在门口。第四天夜里，一块砖头从人墙外面飞进来，砸在你旁边一个青工的额头上。他没松手。血顺着眉毛流下来，流进眼睛里，他一直眨眼。</p>` :
      `<p>报社那几天，你穿过人墙去找过赤卫队领头的。那人五十来岁，是个劳模，胸口别着好几枚纪念章。他说，我们也反对反动路线，我们只是不赞成打倒一切。你说，我们也没说要打倒一切。两个人在路灯底下各抽了一根烟，身后两边的人都在看。你回来以后，有人问你跟保皇派说了什么，你说说了抽烟的事。</p>`;
    return `${pre}
<p>十二月二十三日，赤卫队在人民广场开大会，号称三十万人。他们提了八项要求，第一条是承认赤卫队是革命的群众组织。二十四日凌晨，曹荻秋签了字。</p>
<p>消息传到工总司，屋里好几个人拍了桌子。一个多月前，曹荻秋说你们非法，现在他签字承认了另一边。</p>
<p>第二天上午，陈丕显在病中主持市委书记处开会，说曹荻秋签字是政治立场错误。第三天下午，工总司和另外七个造反组织在文化广场开誓师大会。曹荻秋被请上台，对着话筒说，那个签字作废，他是被迫签的，第二到第六条他当时就没同意。陈丕显说，赤卫队的事是张祺、杨士法搞的，签字是曹荻秋个人的事，书记处没有同意。</p>
<p>你坐在台上。他念完那句话，把稿纸折起来，手在抖。台下有人喊，赤卫队是保皇组织。喊声一浪一浪地过来。</p>
<p>一个多月前，也是在这个广场上，你们等他来，他没来。现在他来了，说的是这一句。</p>`;
  },
  choices:()=>[
    {t:"站起来，带头喊，赤卫队是保皇组织！", set:"shout_bh",
     a66:"12月25日　文化广场誓师大会，揭露保皇组织赤卫队。",
     a77:"12月25日　煽动围攻赤卫队群众，激化群众组织对立。", next:"b3"},
    {t:"你坐着没动。口号从你身边过去。", set:"silent25",

    ...(has("cite_const") ? [{grown:true, t:"走到话筒前。“一个多月前，我在这里念过一条宪法。第八十七条，结社自由。那一条，赤卫队也有份。”", set:"assoc_all",
     a66:"12月25日　大会上提出各群众组织均享有宪法规定的结社自由。",

  src:`<p><span class="tag hist">史实</span> 曹荻秋签字的时间，黄金海作12月24日凌晨；25日大会上他说自己是“被迫”的，第二到第六条当时没同意；陈丕显把赤卫队的事推给张祺、杨士法。12月初马天水从北京开会回来，在市委内部讲自己立场转变，带动一批干部转向。见《十年非梦》第五章。</p>
<p><span class="tag hist">史实</span> 12月23日下午赤卫队在人民广场召开“向上海市委资产阶级反动路线猛烈开火夺取新的胜利大会”，一说三十万人参加，提出承认赤卫队是群众性革命组织等八条要求，曹荻秋签字。24日上午陈丕显主持书记处会议，认为签字是政治立场错误。25日下午工总司等八个造反组织在文化广场开誓师大会，曹荻秋声明签字作废。见国史网〈上海“一月革命”的前前后后〉、维基〈康平路事件〉（搜索摘要）。八条全文待原文。</p>

SC.b3 = {
  act:2, tl:1, tone:"2", persona:true,
  stamp:"1966年12月26日至28日", place:"康平路 · 市委书记处大院",
  title:"请愿",
  text:()=>`
<p class="aside">视角切换。你现在是陆根宝，三十六岁，国棉某厂保全工，赤卫队员。<span class="tag fict">虚构人物</span></p>
<p>二十三号那天你在人民广场，站在很后面，看不见台上，只听见喇叭里说曹市长签字了。旁边的人把帽子扔起来，你没扔，你把帽子攥在手里，攥出了汗。</p>
<p>你入党十一年，车间里哪台车出了毛病都找你。你参加赤卫队，是因为你觉得党委再有错也是党委，机器不能停。安亭那天你坐在火车上，看着铁轨上的人，心里想的就是这句话。</p>
<p>二十五号晚上，厂里的喇叭说签字作废了，赤卫队是保皇组织。你老婆问你，保皇是什么意思。你说不出来。</p>
<p>二十七号总部开会，有人说，市委不认账，我们就让上海停水、停电、停交通，看他认不认。你坐在后排，听见这句话，手心出了汗。你参加赤卫队，图的就是机器不停。没有人反对。会上最后定的是去康平路，找市委要个说法。二十八号下午你跟着队伍进了市委大院。两万来人，院子里站满了，门外还有。你们派了代表进楼，楼里的灯一直亮着，没有人出来。天黑以后下起了冻雨。</p>
${has("wait_cmte") ? `<p>你旁边一个年轻人说，一个多月前，造反派也在这个门口站过一夜，也没人出来。他说这话的时候有点幸灾乐祸，说完了，自己也不笑了。</p>` : `<p>有人说，一个多月前，造反派为了同一个签字拦了火车。你想起安亭，想起周月娥那天在车上一直数苹果。</p>`}
<p>半夜，有人从院墙外面往里扔了一沓传单，上面写着，赤卫队滚出康平路。你捡起一张，叠好，放进棉袄口袋。你也不知道为什么要留着。</p>`,

  src:`<p><span class="tag hist">史实</span> 12月27日赤卫队总部开会，有人提议全市停水、停电、停铁路交通、邮电，以向市委和中央施压，这些措施后来部分实施。见黄金海《十年非梦》第五章（黄说这些材料来自事后赤卫队成员的交代揭发）。</p>
<p><span class="tag hist">史实</span> 26日晚赤卫队总部开会决定去康平路请愿；28日下午近两万人涌进市委大院。见维基〈康平路事件〉（搜索摘要）。</p>
<p><span class="tag fict">虚构</span> 陆根宝是合成人物，代表赤卫队里那些真心相信自己在保卫党和生产的普通工人。他在第一幕的车厢里出现过。</p>`

  title:"电话",
  text:()=>{

      has("lead_pan") ? `电话先打给潘国平，他听了一会儿，把话筒递给你。` : `接电话的是值班的人，他听完了，捂着话筒喊你。`;

    return `
<p>二十九号早上，电话铃响了很多次。</p>
<p>${who}徐景贤说，春桥同志昨天夜里从北京打电话回家，让他爱人转告。赤卫队这是在造曹荻秋的反，是想抢功。各造反组织要注意，不要让赤卫队把胜利的果实夺走了。</p>

<p>头天晚上，你和潘国平、黄金海坐总部的车去康平路看过一次。路上挤满了人，分不清哪边是哪边。车开到衡山饭店门口熄了火，门口的赤卫队员看见了，走过来几个。你们俩不敢下车，怕被认出来。同车的丁德法下去请他们帮忙推一把，那几个人挺热心，帮着把车推着了。</p><p>中午，耿金章从北京赶了回来。他说是春桥同志的秘书打电话叫他回来的。他在总部隔壁要了一间屋子，墙上挂一张地图，康平路用红铅笔圈了起来。${g}</p>
<p>到了下午，各区的人陆陆续续往总部报数。三千，五千，一万。有人从厂里拉来了卡车。有人在分发柳条帽和木棍，木棍是从厂里的废料堆里挑出来的，有的还带着钉子，有人拿钳子把钉子一根一根拔掉。</p>
<p>你知道康平路那个院子里是什么人。两万个赤卫队员，冻了一天一夜，很多是四五十岁的老工人，像他们这样的人你在车间里见过很多。你也知道，这些人一个多月前说你们是拦火车的坏分子，说回厂以后要好好查。</p>

  src:`<p><span class="tag disp">有争议</span> 张春桥在电话里说了什么。徐景贤在特别法庭上交代的“三点指示”是柯老家不许冲、大权不能落到赤卫队手中、叫王洪文调队伍去打；黄金海在隔离审查时翻到自己1967年12月的工作手册，记的是柯老家不许冲、不要抓人太多、造反派应该坐下来务务虚。黄金海还说，康平路时“工总司”总部没有调过人，在场的是“红卫军”和二兵团，王洪文、潘国平、丁德法和他坐车去看过一次，车在衡山饭店门口熄火，是赤卫队员帮着推起来的。见《十年非梦》第五章。</p>
<p><span class="tag hist">史实</span> 28日夜张春桥在北京与妻子李文静通电话；29日早李文静打电话给徐景贤，转达张春桥的意思，要各造反组织注意，“不要让赤卫队把胜利的果实夺走了”。29日耿金章接到张春桥秘书电话从北京赶回上海，设临时指挥部。见维基〈康平路事件〉、RFA“激战康平路”（搜索摘要）。</p>

<p>一月六日人民广场的大会，你是在病床上听的广播。一月九日的《紧急通告》，一月十一日中央的贺电，上面都没有你的名字。工总司的人来看过你，送了一面锦旗，写着为革命负伤。</p>
<p>锦旗挂在病房墙上。隔壁床是一个赤卫队员，也是在昆山伤的，腿上打着石膏。你们两个住了一个月，谁也没跟谁说话。出院那天，他老婆来接他，顺手把你床头的暖瓶灌满了。</p>`,
  verdict:()=>({
    title:"结论",
    lines:[
      "事由　1966年12月31日于昆山拦截赤卫队群众时受重伤，住院五十三天。",
      "1966年写法　为革命负伤。",
      "1977年写法　率众赴昆山挑起武斗，本人亦受伤。",
      "此后　一月风暴没有你。上海人民公社的名单上没有这个名字。"
    ],
    seal:"梦止于此"
  }),
  src:`<p><span class="tag fict">虚构</span> 这是第二幕的肉体死局，按 IF 草案第三节设计。历史上王洪文没有去昆山。</p>
<p><span class="tag hist">史实</span> 昆山冲突双方都有人受伤，沪宁线部分列车受阻。一月风暴没有王洪文也照样发生，这是历史的惯性；可没有他，工总司的位置会让给谁，是另一个问题。</p>`
};

SC.b8 = {
  act:2, tl:3, tone:"2", persona:true,
  stamp:"1966年12月30日至1967年1月3日", place:"沪宁线 · 从上海到昆山",
  title:"北上",
  text:()=>`
<p class="aside">视角切换。你又是陆根宝了。</p>
<p>三十号上午你从康平路走出来，袖章没了，棉袄上少了一粒扣子。你没有回家。北站附近聚了很多人，有人说去北京，找毛主席说理。你跟着走了。</p>
<p>你们沿着铁路走。这条路你认得。一个半月前，你坐在十四次特快上，也走过这一段。那天车停在安亭，铁轨上站着一群人，冻得直跺脚。你跟周月娥说，这些人都是被坏人挑动的。</p>
<p>走过安亭站的时候天已经黑了。站台上没有人，只有一盏灯。你站了一会儿，后面的人催你，你才接着走。${has("lu_home")?"你想起前天夜里回家那一趟，孩子睡着了，你没叫醒他。":""}</p>
${FIG.line(["anting","kunshan"])}
<p>三十一号下午你们走到昆山。后面追来了卡车，车上是造反派。${has("let_north")?"来的人比你想的少。有人说，工总司那边的头头说了句让他们去，可二兵团的人还是来了。":""}</p>
<p>铁路边上打了起来。一列客车停在不远的地方，车上的人扒着窗户往外看。你忽然想，一个半月前，扒着窗户往外看的那个人是我。</p>
<p>一月三日，市委书记处的马天水坐车赶到昆山。他站在一辆卡车上，拿着喇叭，劝大家回上海，说问题回去解决。他的嗓子哑了。有人问他，市委还算不算数。他没有回答。</p>`,
  choices:[
    {t:"你跟着马天水的车回了上海。", set:"lu_back", a66:null, a77:null, next:"b9"},
    {t:"你没有回头。你跟着剩下的六七千人继续往北走。", set:"lu_bj", a66:null, a77:null, next:"b9"}
  ],
  src:`<p><span class="tag hist">史实</span> 31日下午北上的赤卫队到达昆山，冲突中沪宁线部分列车受阻；1967年1月3日马天水等赶到昆山劝返，最后仍有六七千人去了北京，史称昆山事件。见维基〈康平路事件〉〈一月风暴〉（搜索摘要）。</p>
<p><span class="tag hist">设计</span> 安亭和昆山在沪宁线上只隔一站。两次北上告状的理由几乎一样，地方不承认，去找中央。这一段让玩家从另一边再走一遍安亭。</p>
<p><span class="tag fict">虚构</span> 陆根宝的经历为游戏演绎。</p>`
};

SC.b9 = {
  act:2, tl:3, tone:"2r",
  stamp:"1967年1月4日至6日", place:"人民广场",
  title:"广场",
  text:()=>`
<p>一月五日，工总司和另外八个组织联名发了一个通令，欢迎赤卫队员返沪回厂，说对受蒙蔽的阶级弟兄要团结、批评、团结，把一般赤卫队员当敌人对待是极端错误的。不少厂里敲锣打鼓地把他们接了回去。也有不少厂没有敲锣。</p><p>新年过后，事情一件接一件。一月四日，《文汇报》被造反派接管。五日，《解放日报》也接管了，报上登出《告上海全市人民书》。</p>
<p>六日，人民广场开大会，名字很长，叫彻底打倒以陈丕显、曹荻秋为首的上海市委大会。广场上的人看不到边，报上后来说有一百万。</p>
<p>陈丕显和曹荻秋被押上台。台上放着一张乒乓球桌，他们被推上去站着，好让台下都看得见。陈丕显的鼻咽癌还没好，脖子上贴着纱布，说话的声音是哑的。风很大，有人把他们的帽子摘了，扔到台下。</p>
<p>曹荻秋站在乒乓球桌上，一直在看自己的脚。一个多月前，你们在文化广场等他，他没来。十来天前，他在同一个位置宣布签字作废。现在他站在一张乒乓球桌上，头发被风吹得竖起来。</p>
<p>台下有人往上扔东西，一个烂菜帮子落在陈丕显脚边。马天水也在台上，站在陈丕显后面半步，脸色灰白。</p>
<p>你手里有一份发言稿，是写作组的人连夜写的，字很工整。</p>`,
  choices:[
    {t:"你走到台边，把一顶帽子递上去。", set:"hat",
     a66:"1月6日　参加打倒上海市委大会。",
     a77:"1月6日　在批斗大会上对陈丕显、曹荻秋态度暧昧。", next:"b10"},
    {t:"照着稿子念。", set:"read",
     a66:"1月6日　在打倒上海市委大会上发言，揭批陈丕显、曹荻秋。",
     a77:"1月6日　在批斗大会上对陈丕显、曹荻秋等进行残酷迫害。", next:"b10"},
    {t:"说总部有急事，没有上台。", set:"absent",
     a66:"1月6日　在总部值守。",
     a77:"1月6日　参与策划打倒上海市委大会。", next:"b10"}
  ],
  src:`<p><span class="tag hist">史实</span> 1月5日工总司会同红卫兵等九个组织发出《热烈欢迎捍卫毛泽东思想工人赤卫队返沪回厂参加生产》的通令，五条，其中说“把一般赤卫队员当敌人对待是极端错误的”。见黄金海《十年非梦》第五章。</p>
<p><span class="tag hist">史实</span> 1月4日造反派接管《文汇报》，5日接管《解放日报》并发表《告上海全市人民书》。6日人民广场召开“彻底打倒以陈丕显、曹荻秋为首的上海市委大会”，陈丕显、曹荻秋被押上室外主席台的乒乓球桌，冷风里不许戴帽子；张春桥、姚文元在别处看电视直播。会后市委市府停止运转。见维基〈一月风暴〉、RFA“一月风暴”一讲（搜索摘要）。人数有十万、百万等说法，百万是当时的宣传数字。</p>
<p><span class="tag hist">史实</span> 陈丕显1966年4月至12月因鼻咽癌病休，见维基〈陈丕显〉（搜索摘要）。</p>
<p><span class="tag fict">虚构</span> 烂菜帮子、写作组的发言稿为游戏演绎。这是一月风暴的铺垫，三个选项只改变别人怎么记你。</p>`
};

SC.b10 = {
  act:2, tl:3, tone:"2r",
  stamp:"1967年1月7日至9日", place:"工总司总部",
  title:"紧急通告",
  text:()=>{
    const pre = has("hat") ? `<p>你递帽子的时候，台下有人喊了一声，你没听清喊的是什么。陈丕显接过帽子，没有戴，拿在手里。后来有人又把帽子打掉了。晚上总部开会，有人说你立场有问题，有人说你是做给张春桥看的。你两句都没有回。</p>` :
      has("read") ? `<p>你念稿子的时候念错了一个字，台下没人听出来。念完了，你把稿子叠起来揣进口袋，下台的时候经过乒乓球桌，陈丕显的鞋离你的脸只有一尺远。</p>` :
      `<p>那天你在总部，听着喇叭里的广播，一直听到散会。</p>`;
    const zhou = has("talked") ? `<p>还有一个女工，四十来岁，你一时想不起在哪里见过。她说她是国棉某厂的挡车工，姓周。安亭那天，她下车问过铁轨上的人为什么要拦车。她那次请了三天假去南京，母亲没等到她。厂里扣了她三天工资，还给她记了旷工。她说钱她不要了，她要把旷工两个字去掉。</p>` : ``;
    return `${pre}
<p>这几天，总部门口排队的人换了一批。来登记入会的少了，来要钱的多了。元旦晚上，曹荻秋在香山路开了一个干部会，传了陈丕显的话，经济问题放宽一些，不要顶。会上定了五条，长期临时工、外包工可以改成固定工，五八年以后下放支农的工人可以回原厂。传达一下来，各单位都开了闸。</p>
<p>临时工来要转正，合同工来要转固定工，下放到外地的人要回上海，还有人拿着一张单子，上面写着这些年被扣掉的工资，一笔一笔，用铅笔写的，写了好几年。有些单位的领导批得很快，一发就是几个月的钱，银行门口排起了长队。</p>
<p>排在队里的有一个你认识的人。愚园路那天晚上，那个一直搓手的临时工，姓范。他说他在厂里干了九年，还是临时工。工总司成立的时候他是第一批登记的，现在他想问问，转正的事能不能办。</p>
${zhou}
<p>晚上，有人送来一份稿子，标题叫《紧急通告》。是几个红卫兵执笔的，写作组的朱永嘉也帮着出了主意。一共十条，说这股风叫经济主义，是市委走资派从经济上发动的新反扑，要大家抓革命，促生产，工资的事一律等运动后期处理。底下要各造反组织签名。耿金章已经抢先以工总司的名义签了，有人说他代表不了工总司，要总部的人重签。</p>
${FIG.notice()}
<p>范师傅还在门外等着。窗户上有他的影子。</p>`;
  },
  choices:[
    {t:"照原样签名。", set:"sign_notice",
     a66:"1月9日　联合发布《紧急通告》，反击经济主义妖风。",
     a77:"1月9日　参与发布所谓《紧急通告》，为夺权制造舆论。", next:"b11"},
    {t:"提出在通告里加一条。临时工转正的事不算经济主义，要单独处理。", set:"add_temp",
     a66:"1月9日　参与起草《紧急通告》，提出临时工问题应单独处理。",
     a77:"1月9日　参与发布所谓《紧急通告》。", next:"b11"}
  ],
  src:`<p><span class="tag hist">史实</span> 1967年1月1日晚曹荻秋在香山路主持干部会，传达陈丕显“经济问题放宽一些，不要顶”，定出五条，长期临时工、外包工可改为固定工，1958年后下放支农的工人回原厂等。《紧急通告》由红卫兵执笔，朱永嘉参与讨论；耿金章先以工总司名义签字，后改由范佐栋签；毛泽东1月10日批示“此两件很好”。见黄金海《十年非梦》第六章，第六章并录有通告全文。</p>

<p><span class="tag hist">史实</span> 1967年初上海出现大规模补发工资、临时工转正、下放人员回城的要求，部分单位滥发钱款，银行出现挤兑。</p>
<p><span class="tag fict">虚构</span> 范师傅、周月娥的来访为游戏演绎。第二个选项在历史上没有发生，游戏里它也会被删掉。</p>`

  text:()=>`

  src:`<p><span class="tag hist">史实</span> 成立大会计划20万人，来了近百万；二兵团对公社组成不满，准备在主席台东侧集中发难，黄金海提前调杨浦区几千人占住东侧，大会原定潘国平主持。见《十年非梦》第七章。</p>
<p><span class="tag hist">史实</span> 2月5日上海人民公社在人民广场成立，通过经张春桥、姚文元修改的宣言《一月革命胜利万岁！》，发出《一号通令》；张春桥任主任，姚文元、王洪文任副主任。从未进行选举。宣言原文写明选举要等“全面大夺权取得胜利后”，目前由各造反组织“协商推举”组成三结合的临时委员会，并有“随时撤换清洗”一句，见维基文库所收宣言全文。见维基〈一月风暴〉、百度百科〈上海人民公社〉、李逊〈巴黎公社原则在文革中的蜕变〉（搜索摘要）。</p>

<p>三月第一个礼拜，国棉十七厂投票。选票是用香烟壳子的背面裁的，一个车间一个木箱。细纱车间的女工排着队，有人不识字，请旁边的人代写，写完了又不放心，拿回来叫第三个人念一遍。</p>
<p>结果出来，十七厂选上的公社委员不是你。是一个五十几岁的老挡车工，劳模，赤卫队的。她得了四百多票，你少她六十来票。宣布的时候，车间里静了一下，然后有人鼓掌，有人摔门。</p>
<p>二兵团在十几个厂里拿了多数。红革会散了以后的学生，一票也没有。有个厂选出来的人，第二个礼拜就被自己车间的人罢免了，理由是他分房子先分给了自己的小舅子。</p>
<p>三月的产量报表比二月低了一截。马天水拿着报表来找你，一句话也没说，把报表放在桌上。</p>
<p>警备区派了一个参谋来列席公社的会。他坐在最后一排，从头到尾没有发言，只是记。</p>
<p>张春桥不再给你打电话了。三月底，北京来了一个电话，说要你去一趟。</p>`,
  src:`<p><span class="tag hist">史实</span> 公社宣言自己承诺过选举，“在上海自下而上的全面大夺权取得胜利后，由革命群众按照巴黎公社原则选举产生”。这条梦只是把“以后”提前到了三月。</p>
<p><span class="tag fict">虚构</span> 这是巴黎公社这条梦（A1）在第二幕的收尾。它为什么历史上没有发生？毛泽东担心选举会动摇党的领导，张春桥也没有坚持。谁付了代价？选举里落选的人、被罢免的人、少了产量的车间，还有在这张桌子前坚持的人自己。它能维持多久，要到第三幕才知道，那时会分出三种结局，军管、慢慢官僚化、成为全国第一个选举制的地方政权。</p>
<p><span class="tag hist">史实</span> 《十六条》写明要实行“像巴黎公社那样的全面的选举制”，但上海人民公社从未进行过选举。见李逊〈巴黎公社原则在文革中的蜕变〉。</p>`
};

    ${st.tab==='arch'?archivePanel():''}${st.tab==='gl'?glossPanel():''}
    ${nxt && SC[nxt] ? `<button class="restart" id="next">下一幕　${E.nextLabel.replace(/^第.幕　/,"")}</button>` : (nxt ? `<p class="note-start">下一幕尚未制作。</p>` : `<p class="note-start">这一局的梦停在这里。</p>`)}
    <button class="restart ${nxt&&SC[nxt]?"alt":""}" id="again">再做一次梦</button>
  </div>`;
  app.querySelectorAll("[data-k]").forEach(b=>b.onclick=()=>{ st.lens=b.dataset.k; save(); render(); });
  bindBar();
  const n = document.getElementById("next");
  if(n) n.onclick=()=>{ st.lens="huang"; st.y77=false; go(nxt); };
  document.getElementById("again").onclick = startDream;
}
if(window.claude && window.claude.hot && window.claude.hot.snapshot){
  try{ window.claude.hot.snapshot(()=>({st})) }catch(e){}
}
render();
})();
</script>
